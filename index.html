<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data: blob: https: http:; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://accounts.google.com https://apis.google.com https://t1.kakaocdn.net https://developers.kakao.com https://static.nid.naver.com; connect-src 'self' blob: https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com https://kauth.kakao.com https://kapi.kakao.com https://nid.naver.com https://openapi.naver.com https://image.pollinations.ai https://pollinations.ai https://fal.run https://queue.fal.run https://api.fal.ai https://api.replicate.com https://platform.higgsfield.ai https://api.higgsfield.ai https://*.higgsfield.ai; frame-src https://accounts.google.com https://kauth.kakao.com https://nid.naver.com; form-action https://accounts.google.com https://kauth.kakao.com https://nid.naver.com; base-uri 'none'; frame-ancestors 'none'">
<title>페이스루크 — 얼굴 모델 전문 공유 플랫폼</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--panel:#1a1d27;--panel2:#151822;--line:#2b3040;--tx:#e6e8ef;--dim:#8b93a7;
 --acc:#4f7cff;--ok:#7de2a8;--warn:#ffb86c;--bad:#ff6b6b;--gold:#ffc861}
body{font-family:'Pretendard','Malgun Gothic','Segoe UI',sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:1220px;margin:0 auto;padding:0 22px}

header{position:sticky;top:0;z-index:50;background:rgba(15,17,23,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:16px;height:60px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.4px}
.logo .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#4f7cff,#9b5cff);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
nav.top{display:flex;gap:4px}
nav.top button{padding:7px 13px;border-radius:7px;font-size:13.5px;color:var(--dim);font-weight:600}
nav.top button:hover{background:var(--panel);color:var(--tx)}
nav.top button.on{background:var(--panel);color:#fff}
.search{flex:1;max-width:330px;margin-left:auto;position:relative}
.search input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 13px 9px 34px;font-size:13.5px;outline:none}
.search input:focus{border-color:var(--acc)}
.search .ic{position:absolute;left:11px;top:9px;color:var(--dim);font-size:13px}
.btn{background:var(--acc);color:#fff;font-weight:700;font-size:13.5px;padding:9px 15px;border-radius:9px;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--tx)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.me{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 11px 5px 6px;font-size:13px;font-weight:600}
.me img{width:22px;height:22px;border-radius:50%}

.banner{background:linear-gradient(100deg,#1b2340,#221a3a);border:1px solid #33406b;border-radius:13px;padding:17px 20px;margin:20px 0 4px;display:flex;align-items:center;gap:16px}
.banner .t{flex:1}
.banner h2{font-size:15.5px;font-weight:800;margin-bottom:4px}
.banner p{font-size:12.8px;color:#b9c4e4;line-height:1.6}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:18px 0 14px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:600}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 11px;font-size:12.5px;font-weight:600;outline:none}
.divider{width:1px;height:20px;background:var(--line);margin:0 2px}
.seclabel{font-size:12px;font-weight:800;color:var(--dim);letter-spacing:.7px;margin:18px 0 12px;display:flex;align-items:center;gap:9px}
.seclabel .ln{flex:1;height:1px;background:var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:16px;padding-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .13s,border-color .13s}
.card:hover{transform:translateY(-3px);border-color:#3f4660}
.cover{height:214px;position:relative;background:#14171f center/cover no-repeat;display:flex;align-items:flex-end;padding:9px}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(8,10,16,.55);color:#fff;font-size:16px;z-index:2;line-height:1}
.heart.on{color:#ff7a9a}
.heart:hover{background:rgba(8,10,16,.75)}
.favbtn{width:100%;margin-top:8px;padding:10px;border-radius:9px;font-weight:700;font-size:13.5px;border:1px solid var(--line);background:var(--panel);color:var(--tx)}
.favbtn.on{border-color:#ff7a9a;color:#ff7a9a}
.minehead{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px 20px;margin:18px 0 14px}
.minehead img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.minehead h2{font-size:18px;font-weight:800;margin:0 0 4px}
.minehead p{font-size:12.8px;color:var(--dim);line-height:1.55}
.minetabs{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
.minetabs button{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700}
.minetabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:5px;background:rgba(0,0,0,.66);color:#fff}
.tag.new{background:#2f9e6e}.tag.pend{background:var(--warn);color:#241a06}
.tag.syn{background:#6c5ce7}.tag.self{background:#2f7fd4}.tag.cons{background:#2f9e6e}
.cbody{padding:11px 12px 12px}
.cbody h3{font-size:13.8px;font-weight:700;line-height:1.35;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:37px}
.stars{color:var(--gold);font-size:11.5px;letter-spacing:.5px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--dim);margin-top:5px}
.who{display:flex;align-items:center;gap:5px}
.av{width:16px;height:16px;border-radius:50%}

.detail{padding:20px 0 60px;display:grid;grid-template-columns:1fr 346px;gap:26px;align-items:start}
.hero{height:520px;border-radius:12px;background:#14171f center 8%/cover no-repeat;margin-bottom:10px;overflow:hidden;position:relative}
.angles{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:22px}
.angles .a{border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;background:#14171f center 10%/cover no-repeat;height:78px;position:relative}
.angles .a.on{border-color:var(--acc)}
.angles .a span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);font-size:9.5px;font-weight:700;text-align:center;padding:2.5px 0;z-index:2}
h1.tit{font-size:25px;font-weight:800;letter-spacing:-.5px;margin-bottom:9px;line-height:1.3}
.byline{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--dim);margin-bottom:18px;flex-wrap:wrap}
.sec{margin-bottom:26px}
.sec h2{font-size:13px;font-weight:800;color:var(--dim);letter-spacing:.6px;margin-bottom:11px}
.desc{font-size:14px;line-height:1.85;color:#c9cfe0;white-space:pre-wrap}
.facegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.fcell{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.fcell .k{font-size:11px;color:var(--dim);font-weight:700;margin-bottom:3px}
.fcell .v{font-size:13.5px;font-weight:700}

.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vtabs{display:flex;gap:2px;padding:9px 9px 0;overflow-x:auto}
.vtabs button{padding:8px 13px;font-size:12.5px;font-weight:700;color:var(--dim);border-radius:7px 7px 0 0;white-space:nowrap}
.vtabs button.on{background:var(--panel2);color:#fff}
.vbody{background:var(--panel2);padding:15px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:12.8px}
.kv .k{color:var(--dim)}
.kv .v{text-align:right;font-weight:600}
.dlstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.dlstat div{background:#1e2230;border:1px solid var(--line);border-radius:9px;padding:10px 6px;text-align:center}
.dlstat .n{font-size:17px;font-weight:800;letter-spacing:-.5px}
.dlstat .l{font-size:10.5px;color:var(--dim);font-weight:700;margin-top:2px}
.words{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.word{background:#232838;border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:11.5px;font-family:Consolas,monospace;cursor:pointer;color:var(--warn)}
.file{background:#1e2230;border:1px solid var(--line);border-radius:9px;padding:11px;margin-top:11px}
.fhead{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.fname{font-size:12.3px;font-weight:700;word-break:break-all}
.fsize{font-size:11.5px;color:var(--dim);flex-shrink:0}
.scan{display:flex;gap:6px;font-size:11.3px;font-weight:700;padding:5px 8px;border-radius:6px;margin-top:6px}
.scan.ok{background:#1b3a2a;color:var(--ok)}
.scan.pend{background:#3a2f1b;color:var(--warn)}
.hash{font-family:Consolas,monospace;font-size:10.2px;color:var(--dim);margin-top:6px;word-break:break-all}
.dlbtn{width:100%;padding:12px;border-radius:9px;font-weight:800;font-size:14px;margin-top:13px;background:var(--acc);color:#fff}
.dlbtn:disabled{background:#2b3040;color:#6b7386;cursor:not-allowed}
.dlbtn.login{background:#2f9e6e}
.freetag{text-align:center;font-size:11.3px;color:var(--ok);font-weight:700;margin-top:8px}

/* 리뷰 */
.rsum{display:flex;gap:22px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px 20px;margin-bottom:14px}
.rbig{text-align:center;flex-shrink:0}
.rbig .n{font-size:34px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.rbig .s{color:var(--gold);font-size:13px;margin-top:4px}
.rbig .c{font-size:11.5px;color:var(--dim);margin-top:3px}
.rbars{flex:1}
.rbar{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);margin-bottom:3px}
.rbar .t{width:22px}
.rbar .track{flex:1;height:6px;background:#232838;border-radius:3px;overflow:hidden}
.rbar .track i{display:block;height:100%;background:var(--gold)}
.rbar .cnt{width:26px;text-align:right}
.rev{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:9px}
.rhead{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.rhead .nm{font-size:12.8px;font-weight:700}
.rhead .st{color:var(--gold);font-size:11.5px}
.rhead .dt{font-size:11.3px;color:var(--dim);margin-left:auto}
.rtext{font-size:13.3px;line-height:1.75;color:#c9cfe0;white-space:pre-wrap}
.rform{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px;margin-bottom:14px}
.rstars{display:flex;gap:3px;margin-bottom:10px}
.rstars button{font-size:23px;color:#3a4055;line-height:1}
.rstars button.on{color:var(--gold)}

.up{max-width:730px;padding:24px 0 70px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.step h2{font-size:15px;font-weight:800;margin-bottom:4px}
.step .hint{font-size:12.3px;color:var(--dim);margin-bottom:14px;line-height:1.65}
label.fl{display:block;font-size:12.3px;font-weight:700;color:var(--dim);margin:13px 0 6px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;outline:none}
.inp:focus{border-color:var(--acc)}
textarea.inp{min-height:92px;resize:vertical;line-height:1.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.drop{border:2px dashed var(--line);border-radius:11px;padding:30px;text-align:center;cursor:pointer}
.drop:hover{border-color:var(--acc);background:#171b26}
.drop .big{font-size:14.5px;font-weight:700;margin-bottom:5px}
.drop .sm{font-size:12.3px;color:var(--dim);line-height:1.7}
.alert{border-radius:9px;padding:12px 14px;font-size:12.6px;line-height:1.7;margin-top:12px}
.alert.err{background:#2e1a1a;border:1px solid #5a2a2a;color:#ffb3b3}
.alert.ok{background:#152e22;border:1px solid #2a5a42;color:#b3ffd6}
.alert.info{background:#1a2333;border:1px solid #2a3f5a;color:#b3d1ff}
.alert.warn{background:#2e2615;border:1px solid #5a4a2a;color:#ffdca8}
.alert b{color:#fff}
.prog{height:5px;background:#232838;border-radius:3px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.consent{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.copt{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:13px;cursor:pointer;text-align:left}
.copt.on{border-color:var(--acc);background:#1b2238}
.copt .t{font-size:13px;font-weight:700;margin-bottom:4px}
.copt .d{font-size:11.3px;color:var(--dim);line-height:1.55}
.anglePrev{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:11px}
.anglePrev div{height:66px;border-radius:7px;background:#14171f center/cover no-repeat;position:relative}
.anglePrev span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);font-size:9px;font-weight:700;text-align:center;padding:2px 0}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}

.sbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:9px;padding:11px 14px;font-weight:700;font-size:13.5px;margin-bottom:8px;border:1px solid transparent}
.sbtn.google{background:#fff;color:#1f1f1f;border-color:#dadce0}
.sbtn.google:hover{background:#f7f8fa}
.sbtn.kakao{background:#fee500;color:#191919}
.sbtn.kakao:hover{filter:brightness(.97)}
.sbtn.naver{background:#03c75a;color:#fff}
.sbtn.naver:hover{filter:brightness(1.05)}
.or{display:flex;align-items:center;gap:10px;margin:14px 0 8px;color:var(--dim);font-size:11.5px;font-weight:700}
.or:before,.or:after{content:'';flex:1;height:1px;background:var(--line)}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;width:100%;max-width:420px}
.mbox h2{font-size:19px;font-weight:800;margin-bottom:6px}
.mbox p{font-size:12.8px;color:var(--dim);line-height:1.7;margin-bottom:16px}
.empty{text-align:center;padding:66px 20px;color:var(--dim)}
.empty .big{font-size:16px;font-weight:700;color:var(--tx);margin-bottom:7px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#232838;border:1px solid var(--line);border-radius:10px;padding:12px 20px;font-size:13.3px;font-weight:600;z-index:200;transition:transform .22s;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:#2a5a42}.toast.err{border-color:#5a2a2a}
.back{font-size:13px;color:var(--dim);font-weight:600;padding:16px 0 0;display:inline-block}
@media(max-width:900px){.detail{grid-template-columns:1fr}.side{position:static}.facegrid{grid-template-columns:repeat(2,1fr)}}

/* ===== 모바일 대응 =====================================================
   760px 이하: 헤더를 3단 그리드로 재배치, 카드 2열, 상세 1열
   380px 이하: 카드 1열, 각도 썸네일 2열
   입력 폰트는 16px 이상으로 둔다 (iOS 사파리가 16px 미만 입력에 자동 확대를 건다) */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
@media (max-width:760px){
  .wrap{padding:0 14px}
  .hbar{height:auto;padding:10px 0;display:grid;grid-template-columns:1fr auto;
        grid-template-areas:"logo auth" "search search" "nav nav";gap:9px;align-items:center}
  .logo{grid-area:logo;font-size:16px}
  #auth{grid-area:auth;justify-self:end}
  .search{grid-area:search;max-width:none;margin:0}
  .search input{font-size:16px;padding:10px 13px 10px 34px}
  .search .ic{top:10px}
  nav.top{grid-area:nav;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  nav.top button{flex:0 0 auto;padding:8px 13px}
  .btn{padding:9px 12px;font-size:13px}
  .btn.sm{padding:7px 10px;font-size:12px}
  .me{padding:4px 9px 4px 5px;font-size:12.5px}
  .me img{width:20px;height:20px}

  .banner{flex-direction:column;align-items:stretch;gap:12px;padding:15px 16px;margin:14px 0 2px}
  .banner .btn{width:100%}

  .filters{gap:7px;padding:14px 0 10px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .filters>*{flex:0 0 auto}
  .divider{display:none}

  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .cover{height:152px;padding:7px}
  .tag{font-size:9.5px;padding:2.5px 6px}
  .cbody{padding:9px 10px 10px}
  .cbody h3{font-size:12.6px;min-height:34px;margin-bottom:4px}
  .stars{font-size:10.4px}
  .meta{font-size:10.5px;margin-top:4px}

  .detail{grid-template-columns:1fr;gap:18px;padding:12px 0 50px}
  h1.tit{font-size:20px}
  .byline{font-size:12px;margin-bottom:14px}
  .hero{height:380px}
  .angles{grid-template-columns:repeat(3,1fr);gap:7px}
  .angles .a{height:96px}
  .angles .a span{font-size:9.5px;padding:3px 0}
  .facegrid{grid-template-columns:repeat(2,1fr)}
  .side{position:static}
  .desc{font-size:13.4px}
  .sec{margin-bottom:22px}

  .rsum{flex-direction:column;align-items:stretch;gap:13px;padding:15px 16px}
  .rbig{display:flex;align-items:center;gap:11px;text-align:left}
  .rbig .n{font-size:27px}
  .rbig .s,.rbig .c{margin-top:0}
  .rev{padding:12px 13px}
  .rhead{flex-wrap:wrap;gap:6px}
  .rhead .dt{margin-left:auto}
  .rtext{font-size:12.8px}

  .up{padding:12px 0 50px}
  .step{padding:16px}
  .two,.three{grid-template-columns:1fr}
  .consent{grid-template-columns:1fr}
  .copt{padding:12px}
  .anglePrev{grid-template-columns:repeat(3,1fr);gap:7px}
  .anglePrev div{height:84px}
  .drop{padding:24px 16px}
  .inp{font-size:16px}
  .mbox{padding:22px}
  .mbox h2{font-size:18px}

  .dlstat .n{font-size:16px}
  .toast{left:14px;right:14px;transform:translateY(80px);max-width:none;text-align:center}
  .toast.show{transform:translateY(0)}
}
@media (max-width:430px){
  #auth{gap:6px}
  .me span{display:none}          /* 닉네임 숨기고 아바타만 */
  .me{padding:4px 6px}
  .btn{padding:8px 10px;font-size:12.5px}
  .btn.sm{padding:7px 9px;font-size:11.5px}
  .logo{font-size:15px}
  .logo .mark{width:23px;height:23px;font-size:11px}
  .banner h2{font-size:14.5px}
}
@media (max-width:340px){
  .grid{grid-template-columns:1fr;gap:12px}
  .cover{height:200px}
  .angles{grid-template-columns:repeat(2,1fr)}
  .anglePrev{grid-template-columns:repeat(2,1fr)}

function injectPhotoModels(db){
  if(!db || !Array.isArray(db.models)) return db;
  PHOTO_MODELS.forEach(s=>{
    if(!db.models.some(m=>m.photoKey===s.photoKey)){
      if(!db.nextId) db.nextId=200;
      const m=mkModel(s, db.nextId++, Date.now());
      m.auto=true; m.user='auto-bot';
      db.models.unshift(m);
    }
  });
  return db;
}
function load(){
  try{ const r=localStorage.getItem(KEY); if(r) return injectPhotoModels(JSON.parse(r)); }catch(e){}
  const models = SEED.map((s,i)=>mkModel(s, i+1, Date.now()-(9-i)*DAY));
  return injectPhotoModels({ models, nextId:100, poolIdx:0, lastAuto:null, user:null, saved:[], library:{} });
}
function ensureModelFields(m){
  if(!m||typeof m!=='object') return m;
  if(!Array.isArray(m.assets)) m.assets=[];
  if(!m.share||typeof m.share!=='object') m.share={code:null,requests:[]};
  if(!Array.isArray(m.share.requests)) m.share.requests=[];
  if(m.share.code===undefined) m.share.code=null;
  if(m.sharedFrom===undefined) m.sharedFrom=null;
  if(m.ownerKey===undefined) m.ownerKey=null;
  if(m.aiStudio===undefined) m.aiStudio=false;
  if(m.faceId===undefined) m.faceId=null;
  if(m.faceSeed===undefined) m.faceSeed=null;
  if(m.facePrompt===undefined) m.facePrompt='';
  if(m.faceRef===undefined) m.faceRef=null;
  if(m.aiProvider===undefined) m.aiProvider=null;
  return m;
}

      const db=r.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      if(!db.objectStoreNames.contains(IDB_ASSETS)) db.createObjectStore(IDB_ASSETS);
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}

/* Save a Blob as a real local file on phone/PC (picker → share → anchor → tab) */
async function saveBlobToDevice(filename, blob, mime){
  const type = mime || (blob && blob.type) || 'application/octet-stream';
  const data = blob instanceof Blob ? blob : new Blob([blob], {type});

  // 1) File System Access (Chromium desktop / Android Chrome)
  if(typeof window.showSaveFilePicker === 'function'){
    try{
      const ext = (String(filename).includes('.') ? '.'+String(filename).split('.').pop() : '');
      const opts = { suggestedName: filename };
      if(ext){
        try{ opts.types = [{ description:'File', accept:{ [type]:[ext] } }]; }catch(_){}
      }
      const handle = await window.showSaveFilePicker(opts);
      const writable = await handle.createWritable();
      await writable.write(data);
      await writable.close();
      return 'picker';
    }catch(e){
      if(e && (e.name==='AbortError')) throw e; // user cancelled
      /* fall through to share/anchor */
    }
  }

  // 2) Web Share Level 2 (iOS Safari / Android Chrome) — real Files app / share sheet
  try{
    const file = new File([data], filename, { type });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title: filename });
      return 'share';
    }
  }catch(e){
    if(e && e.name==='AbortError') throw e;
    /* fall through */
  }

  // 3) Classic <a download> (desktop browsers; some Android)
  try{
    const url = URL.createObjectURL(data);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    try{ a.type = type; }catch(_){}
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
    return 'anchor';
  }catch(e){ /* fall through */ }

  // 4) Open blob in new tab — user can Share/Save As
  const url = URL.createObjectURL(data);
  const w = window.open(url, '_blank');
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
  if(!w) throw new Error('popup blocked');
  return 'tab';
}

function modelCardJson(m){
  return JSON.stringify({
    name:m.name, kind:m.kind, base:m.base, tags:m.tags, words:m.words,
    sMin:m.sMin, sMax:m.sMax, clip:m.clip, desc:m.desc, consent:m.consent, file:m.file||null
  }, null, 2);
}

async function fetchCoverBlob(m){
  if(!(m.photos && m.photos[0])) return null;
  const r = await fetch(m.photos[0]);
  if(!r.ok) return null;
  let blob = await r.blob();
  const u = String(m.photos[0]).toLowerCase();
  let ext = 'jpg', mime = 'image/jpeg';
  if(u.endsWith('.png') || (blob.type||'').includes('png')){ ext='png'; mime='image/png'; }
  else if(u.endsWith('.webp') || (blob.type||'').includes('webp')){ ext='webp'; mime='image/webp'; }
  if(!blob.type || blob.type==='application/octet-stream') blob = new Blob([blob], {type:mime});
  return { blob, ext, mime };
}

async function shareFilesOrFallback(files, title, text){
  try{
    if(navigator.canShare && navigator.canShare({ files })){
      const payload = { files, title: title||files[0].name };
      if(text) payload.text = text;
      await navigator.share(payload);
      return 'share';
    }
  }catch(e){
    if(e && e.name==='AbortError') throw e;
  }
  let method = 'anchor';
  for(let i=0;i<files.length;i++){
    const f = files[i];
    const m = await saveBlobToDevice(f.name, f, f.type||'application/octet-stream');
    if(i===0) method = m;
    /* if first used share, remaining go through saveBlobToDevice which may share again — prefer anchor for rest */
    if(m==='share' && i===0 && files.length>1){
      for(let j=1;j<files.length;j++){
        const fj = files[j];
        const url = URL.createObjectURL(fj);
        const a = document.createElement('a');
        a.href=url; a.download=fj.name; a.rel='noopener';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 60000);
      }
      return 'share';
    }
  }
  return method;
}

async function downloadModelFile(m){
  const weights = await idbGet(m.id);
  if(weights){
    const name = (m.file && m.file.name) || ((m.name||'model')+'.safetensors');
    const method = await saveBlobToDevice(name, weights, weights.type||'application/octet-stream');
    return { kind:'weights', method };
  }

  /* Seed/catalog: save real local files (cover image + model card JSON) — NOT a zip package */
  const safeName = (m.name||'model').replace(/[\\/:*?"<>|]+/g,'_').slice(0,48);
  const cover = await fetchCoverBlob(m);
  const jsonStr = modelCardJson(m);
  const jsonBlob = new Blob([jsonStr], {type:'application/json'});
  const jsonName = safeName+'.json';
  const files = [];
  if(cover && cover.blob && cover.blob.size){
    files.push(new File([cover.blob], safeName+'.'+cover.ext, {type:cover.mime}));
  }
  files.push(new File([jsonBlob], jsonName, {type:'application/json'}));

  /* Prefer multi-file share in the same user-gesture async turn (iOS) */
  const method = await shareFilesOrFallback(files, m.name||safeName, jsonStr);
  return { kind:'files', method };
}

    const s=document.createElement('script'); s.src=src; s.async=true;
    s.onload=resolve; s.onerror=()=>reject(new Error('script'));
    document.head.appendChild(s);
  });
}

    s.onchange=()=>{filt[key]=s.value;render();}; f.appendChild(s); };
  mkSel('gender','성별 전체',GENDERS); mkSel('age','연령 전체',AGES); mkSel('style','스타일 전체',STYLES);
  const d2=document.createElement('div'); d2.className='divider'; f.appendChild(d2);
  const so=document.createElement('select'); so.className='sel';
  [['dl','다운로드순'],['rating','평점순'],['reviews','리뷰많은순'],['new','최신순']].forEach(([v,l])=>{
    const o=document.createElement('option'); o.value=v; o.textContent=l; if(filt.sort===v)o.selected=true; so.appendChild(o); });
  so.onchange=()=>{filt.sort=so.value;render();}; f.appendChild(so);
  app.appendChild(f);

  let list=DB.models.filter(matches);
  list.sort((a,b)=> filt.sort==='rating' ? avgRating(b)-avgRating(a)
                  : filt.sort==='reviews' ? b.reviews.length-a.reviews.length
                  : filt.sort==='new' ? b.createdAt-a.createdAt : b.dl-a.dl);
  if(!list.length){ app.appendChild(emptyBox('검색 결과가 없습니다','다른 키워드나 필터를 시도해보세요')); return; }
  app.appendChild(gridOf(list));
}

  DB.models.forEach(m=>{ ensureModelFields(m); if(m.ownerKey===me || m.user===DB.user.nick) (m.share.requests||[]).filter(r=>r.status==='pending').forEach(r=>pending.push({m,r})); });
  const prov={ google:'구글', kakao:'카카오', naver:'네이버', nick:'닉네임' }[DB.user.provider||'nick']||'로그인';

  const tx=document.createElement('div'); tx.style.flex='1';

  const p=document.createElement('p');
  p.textContent=prov+' · 관심 '+favModels.length+' · 받음 '+dlModels.length+' · 올림 '+upModels.length+' · AI '+aiModels.length;
  tx.appendChild(h2); tx.appendChild(p); head.appendChild(av); head.appendChild(tx); app.appendChild(head);

  const tabs=document.createElement('div'); tabs.className='minetabs';
  [['fav','관심얼굴 '+favModels.length],['dl','받은 얼굴 '+dlModels.length],['up','올린 모델 '+upModels.length],['ai','내 AI 모델 '+aiModels.length],['share','공유함·받음 '+(shareModels.length+(pending.length?('·요청'+pending.length):''))]].forEach(([k,l])=>{
    const b=document.createElement('button'); b.textContent=l; if(mineTab===k)b.className='on';
    b.onclick=()=>{ mineTab=k; render(); }; tabs.appendChild(b);
  });
  app.appendChild(tabs);

  if(mineTab==='ai' || mineTab==='share'){
    const row=document.createElement('div'); row.style.cssText='display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap';
    const ib=document.createElement('button'); ib.className='btn ghost'; ib.textContent='공유 코드로 가져오기'; ib.onclick=()=>openImportShareModal();
    const sb=document.createElement('button'); sb.className='btn'; sb.textContent='AI 스튜디오'; sb.onclick=()=>go('studio');
    row.appendChild(ib); row.appendChild(sb); app.appendChild(row);
  }

  if(mineTab==='fav'){
    if(!favModels.length){ const e=emptyBox('아직 관심얼굴이 없습니다','탐색에서 ♡를 누르면 여기에 모입니다'); const b=document.createElement('button'); b.className='btn'; b.style.marginTop='14px'; b.textContent='얼굴 탐색하기'; b.onclick=()=>go('browse'); e.appendChild(b); app.appendChild(e); return; }
    app.appendChild(gridOf(favModels));
  } else if(mineTab==='dl'){
    if(!dlModels.length){ const e=emptyBox('받은 얼굴이 없습니다','상세 페이지에서 무료 다운로드하면 여기에 쌓입니다'); const b=document.createElement('button'); b.className='btn'; b.style.marginTop='14px'; b.textContent='얼굴 탐색하기'; b.onclick=()=>go('browse'); e.appendChild(b); app.appendChild(e); return; }
    app.appendChild(gridOf(dlModels));
  } else if(mineTab==='ai'){
    if(!aiModels.length){ const e=emptyBox('내 AI 모델이 없습니다','AI 스튜디오에서 얼굴을 생성하고 저장해보세요'); const b=document.createElement('button'); b.className='btn'; b.style.marginTop='14px'; b.textContent='AI 스튜디오'; b.onclick=()=>go('studio'); e.appendChild(b); app.appendChild(e); return; }
    app.appendChild(gridOf(aiModels));
  } else if(mineTab==='share'){
    if(pending.length){
      const rl=document.createElement('div'); rl.className='reqlist';
      pending.forEach(({m,r})=>{
        const it=document.createElement('div'); it.className='reqitem';
        const t=document.createElement('span'); t.textContent=r.from+' → 「'+m.name+'」 · '+dstr(r.at);
        const ok=document.createElement('button'); ok.className='btn sm'; ok.textContent='수락'; ok.onclick=()=>respondShareRequest(m,r.fromKey,true);
        const no=document.createElement('button'); no.className='btn ghost sm'; no.textContent='거절'; no.onclick=()=>respondShareRequest(m,r.fromKey,false);
        it.appendChild(t); it.appendChild(ok); it.appendChild(no); rl.appendChild(it);
      });
      app.appendChild(rl);
    }
    if(!shareModels.length && !pending.length){ app.appendChild(emptyBox('공유한·받은 모델이 없습니다','상세에서 공유 코드를 만들거나, 위에서 코드를 입력해 가져오세요')); return; }

    app.appendChild(gridOf(upModels));
  }
}


function emptyBox(t1,t2){ const e=document.createElement('div'); e.className='empty';
  const a=document.createElement('div'); a.className='big'; a.textContent=t1;
  const b=document.createElement('div'); b.textContent=t2; e.appendChild(a); e.appendChild(b); return e; }

function gridOf(list){
  const g=document.createElement('div'); g.className='grid';
  list.forEach(m=>{
    const c=document.createElement('div'); c.className='card'; c.onclick=()=>go('detail',m.id);
    const cv=document.createElement('div'); cv.className='cover';
    cv.style.backgroundImage='url("'+faceSrc(m,0,300,280)+'")';
    const tg=document.createElement('div'); tg.className='tags';
    const t1=document.createElement('span'); t1.className='tag'; t1.textContent=KINDS[m.kind]; tg.appendChild(t1);
    const cs=CONSENT[m.consent];
    const t2=document.createElement('span'); t2.className='tag '+cs.cls; t2.textContent=cs.ko; tg.appendChild(t2);
    if(new Date(m.createdAt).toISOString().slice(0,10)===today()){
      const t3=document.createElement('span'); t3.className='tag new'; t3.textContent='오늘 등록'; tg.appendChild(t3); }
    if(m.file.scan!=='Success'){ const t4=document.createElement('span'); t4.className='tag pend'; t4.textContent='스캔 대기'; tg.appendChild(t4); }
    const ht=document.createElement('button'); ht.type='button';
    ht.className='heart'+(isFav(m.id)?' on':'');
    ht.textContent=isFav(m.id)?'♥':'♡';
    ht.title=isFav(m.id)?'관심얼굴 해제':'관심얼굴 등록';
    ht.onclick=e=>{ e.stopPropagation(); toggleFav(m.id); };
    cv.appendChild(ht);
    cv.appendChild(tg); c.appendChild(cv);
    const b=document.createElement('div'); b.className='cbody';
    const h3=document.createElement('h3'); h3.textContent=m.name; b.appendChild(h3);
    const av=avgRating(m);
    const st=document.createElement('div'); st.className='stars';
    st.textContent = m.reviews.length ? starStr(av)+'  '+av.toFixed(1)+' ('+m.reviews.length+')' : '☆☆☆☆☆  리뷰 없음';
    if(!m.reviews.length) st.style.color='var(--dim)';
    b.appendChild(st);
    const mt=document.createElement('div'); mt.className='meta';
    const who=document.createElement('div'); who.className='who';
    const ai=document.createElement('img'); ai.className='av'; ai.src=avatar(m.user); ai.alt='';
    const un=document.createElement('span'); un.textContent=m.user;
    who.appendChild(ai); who.appendChild(un);
    const dls=document.createElement('span'); dls.textContent='\u2193 '+fmt(m.dl);
    mt.appendChild(who); mt.appendChild(dls); b.appendChild(mt);
    c.appendChild(b); g.appendChild(c);
  });
  return g;
}

          ? '공유/저장 시트가 열렸습니다. 파일에 저장을 눌러 주세요'

    tags:draft.tags.split(',').map(s=>s.trim()).filter(Boolean),

    clip:draft.clip?parseInt(draft.clip,10):null,
    createdAt:Date.now(), angles:ANGLES.map(a=>a.k),   /* 6방향 자동 첨부 */
    file:{ name:draft.file.name, kb:draft.file.kb, scan:'Pending', sha:draft.file.sha },
    dl:0, log:[], reviews:[] };
  DB.models.unshift(m); save();
  if(draft.fileBlob){

    catch(e){ toast('파일 저장 용량이 부족합니다. 모델은 등록됐지만 가중치 다운로드는 불가할 수 있습니다.','err'); }

  setTimeout(()=>{
    file.scan='Success';

    save(); if(view==='detail'&&curId===m.id) render();

function isModelOwner(m){ if(!DB.user||!m) return false; const me=_userKey(); if(m.ownerKey&&me&&m.ownerKey===me) return true; return m.user===DB.user.nick; }

function crc32Bytes(buf){ let c=~0; if(!crc32Bytes._t){ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let x=n; for(let k=0;k<8;k++) x=x&1?0xedb88320^(x>>>1):x>>>1; t[n]=x; } crc32Bytes._t=t; } const u=buf instanceof Uint8Array?buf:new Uint8Array(buf); for(let i=0;i<u.length;i++) c=crc32Bytes._t[(c^u[i])&0xff]^(c>>>8); return (~c)>>>0; }
function zU16(n){ const b=new Uint8Array(2); new DataView(b.buffer).setUint16(0,n,true); return b; }
function zU32(n){ const b=new Uint8Array(4); new DataView(b.buffer).setUint32(0,n,true); return b; }
function zCat(parts){ let n=0; parts.forEach(p=>n+=p.length); const o=new Uint8Array(n); let i=0; parts.forEach(p=>{o.set(p,i);i+=p.length;}); return o; }
async function zipStore(files){ const enc=new TextEncoder(); const locals=[], centrals=[]; let offset=0; for(const f of files){ const nameBytes=enc.encode(f.name); const data=new Uint8Array(await f.blob.arrayBuffer()); const crc=crc32Bytes(data); const local=zCat([zU32(0x04034b50),zU16(20),zU16(0),zU16(0),zU16(0),zU16(0),zU32(crc),zU32(data.length),zU32(data.length),zU16(nameBytes.length),zU16(0),nameBytes,data]); const central=zCat([zU32(0x02014b50),zU16(20),zU16(20),zU16(0),zU16(0),zU16(0),zU16(0),zU32(crc),zU32(data.length),zU32(data.length),zU16(nameBytes.length),zU16(0),zU16(0),zU16(0),zU16(0),zU32(0),zU32(offset),nameBytes]); locals.push(local); centrals.push(central); offset+=local.length; } const centralDir=zCat(centrals); const end=zCat([zU32(0x06054b50),zU16(0),zU16(0),zU16(files.length),zU16(files.length),zU32(centralDir.length),zU32(offset),zU16(0)]); return new Blob([zCat(locals),centralDir,end],{type:'application/zip'}); }
async function blobToDataUrl(blob){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(blob); }); }
async function fetchAsBlob(url){ const r=await fetch(url,{mode:'cors',credentials:'omit',referrerPolicy:'no-referrer'}); if(!r.ok) throw new Error('fetch '+r.status); return await r.blob(); }
async function urlToDataUrl(url){ if(!url) return null; if(String(url).startsWith('data:')) return url; try{ return await blobToDataUrl(await fetchAsBlob(url)); }catch(e){ try{ const img=await new Promise((res,rej)=>{ const im=new Image(); im.crossOrigin='anonymous'; im.onload=()=>res(im); im.onerror=rej; im.src=url; }); const c=document.createElement('canvas'); c.width=img.naturalWidth||768; c.height=img.naturalHeight||1024; c.getContext('2d').drawImage(img,0,0); return c.toDataURL('image/jpeg',0.88); }catch(e2){ return null; } } }

async function studioGenPollinations(prompt, seed, opts){ const p=photorealPrompt(prompt, opts&&opts.extra); let url='https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+'?width=768&height=1024&model=flux&nologo=true&nofeed=true&enhance=false&seed='+encodeURIComponent(String(seed)); if(opts&&opts.refUrl&&String(opts.refUrl).indexOf('http')===0) url+='&image='+encodeURIComponent(opts.refUrl); return {url, meta:{provider:'pollinations',model:'flux',seed}}; }
async function studioGenFal(endpoint, prompt, falKey){ const res=await fetch('https://fal.run/'+endpoint,{method:'POST',headers:{'Authorization':'Bearer '+falKey,'Content-Type':'application/json'},body:JSON.stringify({prompt:photorealPrompt(prompt),image_size:'portrait_4_3',num_images:1})}); if(!res.ok){ let msg='Fal 요청 실패 ('+res.status+')'; try{ const j=await res.json(); if(j&&(j.detail||j.message||j.error)) msg=String(j.detail||j.message||j.error);}catch(e){} throw new Error(msg);} const data=await res.json(); const img=(data.images&&data.images[0]&&data.images[0].url)||(data.image&&data.image.url)||null; if(!img) throw new Error('Fal 응답에 이미지 없음'); return {url:img, meta:{provider:'fal',endpoint}}; }
async function studioGenFalFlux(prompt){ const cfg=loadStudioCfg(); if(!cfg.falKey){ toast('스튜디오 설정에서 Fal API 키를 입력해주세요','err'); throw new Error('no-fal-key'); } return studioGenFal('fal-ai/flux/dev', prompt, cfg.falKey); }
async function studioGenFalSdxl(prompt){ const cfg=loadStudioCfg(); if(!cfg.falKey){ toast('스튜디오 설정에서 Fal API 키를 입력해주세요','err'); throw new Error('no-fal-key'); } return studioGenFal('fal-ai/fast-sdxl', prompt, cfg.falKey); }
async function studioPollHiggs(statusUrl, headers){ for(let i=0;i<40;i++){ await new Promise(r=>setTimeout(r,1500)); const r=await fetch(statusUrl,{headers}); if(!r.ok) continue; const j=await r.json(); const st=String(j.status||'').toLowerCase(); if(st==='completed'||st==='succeeded'||st==='success'){ const url=(j.images&&j.images[0]&&(j.images[0].url||j.images[0]))||(j.output&&j.output.url)||(j.video&&(j.video.url||j.video))||null; if(!url) throw new Error('Higgsfield URL 없음'); return url; } if(['failed','canceled','cancelled','moderated','error'].includes(st)) throw new Error('Higgsfield 실패: '+st); } throw new Error('Higgsfield 시간 초과'); }
async function studioGenHiggs(prompt, seed, asVideo){ const cfg=loadStudioCfg(); const cred=String(cfg.higgsCredentials||'').trim(); if(!cred||cred.indexOf(':')<0){ toast('Higgsfield 자격증명(key-id:key-secret)을 설정해주세요','err'); throw new Error('no-higgs'); } const headers={'Authorization':'Key '+cred,'Content-Type':'application/json','Accept':'application/json'}; const endpoints=asVideo?[{url:'https://platform.higgsfield.ai/higgsfield-ai/seedance/standard',body:{prompt:photorealPrompt(prompt,'short portrait video same adult face'),aspect_ratio:'9:16',duration:2}}]:[{url:'https://api.higgsfield.ai/z-image/turbo',body:{prompt:photorealPrompt(prompt),resolution:'1k',aspect_ratio:'2:3',seed:seed%2147483647}},{url:'https://platform.higgsfield.ai/higgsfield-ai/soul/standard',body:{prompt:photorealPrompt(prompt),aspect_ratio:'2:3',resolution:'720p'}}]; let lastErr=null; for(const ep of endpoints){ try{ const res=await fetch(ep.url,{method:'POST',headers,body:JSON.stringify(ep.body)}); if(!res.ok){ let msg='HTTP '+res.status; try{ const j=await res.json(); msg=String(j.message||j.error||j.detail||msg);}catch(e){} lastErr=new Error(msg); continue; } const data=await res.json(); const immediate=(data.images&&data.images[0]&&(data.images[0].url||data.images[0]))||(data.video&&(data.video.url||data.video))||(data.output&&data.output.url)||null; if(immediate) return {url:immediate, meta:{provider:'higgsfield',endpoint:ep.url,video:!!asVideo}}; const statusUrl=data.status_url||(data.request_id?'https://platform.higgsfield.ai/requests/'+data.request_id+'/status':null); if(!statusUrl){ lastErr=new Error('status_url 없음'); continue; } return {url:await studioPollHiggs(statusUrl, headers), meta:{provider:'higgsfield',endpoint:ep.url,video:!!asVideo}}; }catch(e){ lastErr=e; } } throw lastErr||new Error('Higgsfield 실패'); }
async function studioGenDemo(prompt, seed){ const c=document.createElement('canvas'); c.width=512; c.height=640; const g=c.getContext('2d'); const h=_hash(String(seed)+String(prompt)); const grad=g.createLinearGradient(0,0,512,640); grad.addColorStop(0,'hsl('+(h%360)+',42%,38%)'); grad.addColorStop(1,'hsl('+((h+80)%360)+',36%,22%)'); g.fillStyle=grad; g.fillRect(0,0,512,640); g.fillStyle='hsla(25,45%,72%,.95)'; g.beginPath(); g.ellipse(256,300,110,140,0,0,Math.PI*2); g.fill(); g.fillStyle='#fff'; g.font='bold 22px sans-serif'; g.textAlign='center'; g.fillText('DEMO FACE',256,520); g.font='14px sans-serif'; g.fillText('seed '+seed,256,548); return {url:c.toDataURL('image/jpeg',0.9), meta:{provider:'demo',seed}}; }

async function runStudioGenerate(){
  if(studioState.busy) return;
  if(!needLogin('AI 생성을 하려면 로그인이 필요합니다.')) return;
  const prompt=(studioState.prompt||'').trim(); if(!prompt){ toast('프롬프트를 입력해주세요','err'); return; }
  let seed=(Date.now()%1000000)^_hash(prompt); let extra=''; let refUrl=null;
  if(studioState.attachToModelId!=null){ const m=DB.models.find(x=>x.id===studioState.attachToModelId); if(m){ ensureModelFields(m); if(m.faceSeed!=null) seed=Number(m.faceSeed)||seed; extra='same identity as previous portrait, consistent face, same person, faceId '+(m.faceId||''); const maybe=m.faceRef||(m.photos&&m.photos[0]); if(maybe&&String(maybe).indexOf('http')===0) refUrl=maybe; } }
  studioState.busy=true; render();
  try{
    let result=null; const p=studioState.provider; const wantVideo=studioState.mode==='add-video';
    if(wantVideo){ if(p==='demo'){ result=await studioGenDemo(prompt, seed); toast('데모는 영상 대신 이미지를 만듭니다'); } else result=await studioGenHiggs(prompt+(extra?', '+extra:''), seed, true); }
    else if(p==='pollinations') result=await studioGenPollinations(prompt, seed, {extra, refUrl});
    else if(p==='fal-flux'){ try{ result=await studioGenFalFlux(prompt+(extra?', '+extra:'')); }catch(e){ if(String(e.message)==='no-fal-key') throw e; toast('Flux 실패 → SDXL 재시도…'); result=await studioGenFalSdxl(prompt+(extra?', '+extra:'')); } }
    else if(p==='fal-sdxl') result=await studioGenFalSdxl(prompt+(extra?', '+extra:''));
    else if(p==='higgsfield') result=await studioGenHiggs(prompt+(extra?', '+extra:''), seed, false);
    else result=await studioGenDemo(prompt, seed);
    const item={ id:'g'+Date.now(), url:result.url, meta:result.meta||{}, prompt, provider:p, gender:studioState.gender, age:studioState.age, style:studioState.style, base:studioState.base, seed:(result.meta&&result.meta.seed!=null)?result.meta.seed:seed, at:Date.now(), isVideo:!!(result.meta&&result.meta.video) };
    studioState.last=item; studioHistory.unshift(item); if(studioHistory.length>12) studioHistory.length=12; toast('생성 완료','ok');
  }catch(e){ if(String(e.message)!=='no-fal-key'&&String(e.message)!=='no-higgs') toast('생성 실패: '+(e.message||e),'err'); }
  finally{ studioState.busy=false; if(view==='studio'||view==='detail') render(); }
}

async function persistCoverAndAsset(modelId, assetId, url){
  const faceKey='face-'+modelId, assetKey='asset-'+modelId+'-'+assetId; let dataUrl=null;
  try{
    if(String(url).startsWith('data:')){ dataUrl=url; const bin=await (await fetch(url)).blob(); await idbAssetPut(faceKey,bin); await idbAssetPut(assetKey,bin); }
    else { let blob=null; try{ blob=await fetchAsBlob(url);}catch(e){} if(blob){ await idbAssetPut(faceKey,blob); await idbAssetPut(assetKey,blob); dataUrl=await blobToDataUrl(blob); } else { dataUrl=await urlToDataUrl(url); if(dataUrl&&String(dataUrl).startsWith('data:')){ const bin=await (await fetch(dataUrl)).blob(); await idbAssetPut(faceKey,bin); await idbAssetPut(assetKey,bin); } } }
  }catch(e){ dataUrl=dataUrl||url; }
  return {faceKey, assetKey, dataUrl:dataUrl||url};
}

async function saveStudioAsModel(){
  if(!needLogin('내 모델로 저장하려면 로그인이 필요합니다.')) return;
  const item=studioState.last; if(!item||!item.url){ toast('먼저 이미지를 생성해주세요','err'); return; }
  if(studioState.attachToModelId!=null){ await addAssetToOwnedModel(studioState.attachToModelId, item); return; }
  const name=(studioState.modelName||'').trim()||('AI 스튜디오 · '+(AGES[item.age]||'')+' '+(GENDERS[item.gender]||'')+' 얼굴').replace(/\s+/g,' ').trim();
  const faceSeed=item.seed!=null?item.seed:((Date.now()%1000000)^_hash(item.prompt));
  const faceId='face_'+Date.now().toString(36)+'_'+(_hash(name+faceSeed)%100000);
  const s={ name, kind:'FaceLORA', gender:item.gender||'female', age:item.age||'twenties', style:'real', consent:'synthetic', user:DB.user.nick, base:item.base||studioState.base||'FLUX.1 D',
    desc:'AI 스튜디오에서 생성한 합성 얼굴입니다. 실존 인물이 아닙니다.\n\n엔진: '+(item.provider||'')+'\n프롬프트: '+item.prompt+'\n\n이 얼굴 아래에 작품을 계속 추가할 수 있습니다. 공유는 공유 코드로 이뤄집니다(서버 동기화 없음).',
    tags:['ai-studio', item.provider||'ai', GENDERS[item.gender]||'', AGES[item.age]||'', '실사'].map(x=>String(x).trim()).filter(Boolean),
    words:['ai_studio', String(item.provider||'ai')], photos:[item.url], kb:163840, dl:0, log:[], reviews:[] };
  const id=DB.nextId++; const m=_mkModel(s, id, Date.now()); ensureModelFields(m);
  m.user=DB.user.nick; m.ownerKey=_userKey(); m.aiStudio=true; m.aiProvider=item.provider||null;
  m.faceId=faceId; m.faceSeed=faceSeed; m.facePrompt=item.prompt; m.file.scan='Success';
  const assetId='a'+Date.now(); const persisted=await persistCoverAndAsset(id, assetId, item.url);
  m.photos=[persisted.dataUrl]; m.faceRef=persisted.dataUrl;
  m.assets.push({ id:assetId, type:item.isVideo?'video':'image', blobKey:persisted.assetKey, dataUrl:persisted.dataUrl, thumb:persisted.dataUrl, prompt:item.prompt, by:DB.user.nick, byKey:_userKey(), at:Date.now(), provider:item.provider||'pollinations' });
  DB.models.unshift(m); save(); studioState.attachToModelId=id; studioState.mode='add-image';
  toast('내 모델로 저장했습니다','ok'); go('detail', id);
}

async function addAssetToOwnedModel(modelId, item){
  if(!needLogin('작품을 추가하려면 로그인이 필요합니다.')) return;
  const m=DB.models.find(x=>x.id===modelId); if(!m){ toast('모델을 찾을 수 없습니다','err'); return; }
  ensureModelFields(m); if(!isModelOwner(m)){ toast('소유자만 작품을 추가할 수 있습니다','err'); return; }
  if(!item||!item.url){ toast('생성 결과가 없습니다','err'); return; }
  const assetId='a'+Date.now(); const assetKey='asset-'+m.id+'-'+assetId; let dataUrl=item.url;
  try{ if(String(item.url).startsWith('data:')){ dataUrl=item.url; await idbAssetPut(assetKey, await (await fetch(dataUrl)).blob()); }
    else { try{ const blob=await fetchAsBlob(item.url); await idbAssetPut(assetKey, blob); dataUrl=await blobToDataUrl(blob); }catch(e){ const du=await urlToDataUrl(item.url); if(du){ dataUrl=du; try{ await idbAssetPut(assetKey, await (await fetch(du)).blob()); }catch(e2){} } } }
  }catch(e){}
  m.assets.push({ id:assetId, type:item.isVideo?'video':'image', blobKey:assetKey, dataUrl, thumb:dataUrl, prompt:item.prompt, by:DB.user.nick, byKey:_userKey(), at:Date.now(), provider:item.provider||'pollinations' });
  save(); toast('작품을 추가했습니다','ok'); studioState.attachToModelId=m.id; go('detail', m.id);
}

async function publishShareCode(m){
  if(!needLogin('공유 코드를 만들려면 로그인이 필요합니다.')) return;

  let code=m.share.code; if(!code){ code=makeShareCode(); m.share.code=code; }
  let faceData=m.faceRef||(m.photos&&m.photos[0])||null; if(faceData&&!String(faceData).startsWith('data:')){ try{ faceData=await urlToDataUrl(faceData)||faceData; }catch(e){} }
  const thumbs=(m.assets||[]).slice(0,8).map(a=>({id:a.id,type:a.type,thumb:(a.thumb&&String(a.thumb).startsWith('data:')?a.thumb:(a.dataUrl&&String(a.dataUrl).startsWith('data:')?a.dataUrl:null)),prompt:a.prompt,provider:a.provider}));

  DB.models.unshift(m); save(); _closeModal(); toast('공유 모델을 추가했습니다 (얼굴 재생성 없음)','ok'); go('detail', id);
}

function requestShareAccess(m){ if(!needLogin('공유 요청하려면 로그인이 필요합니다.')) return; ensureModelFields(m); if(isModelOwner(m)){ toast('본인 모델입니다','err'); return; } if(!m.share.code){ toast('아직 공유 코드가 없습니다','err'); return; } const me=_userKey(); if(m.share.requests.some(r=>r.fromKey===me&&r.status==='pending')){ toast('이미 대기 중인 요청이 있습니다'); return; } m.share.requests.push({ from:DB.user.nick, fromKey:me, at:Date.now(), status:'pending' }); save(); toast('공유 요청을 남겼습니다','ok'); render(); }
function respondShareRequest(m, fromKey, accept){ ensureModelFields(m); if(!isModelOwner(m)){ toast('소유자만 처리 가능','err'); return; } const r=m.share.requests.find(x=>x.fromKey===fromKey&&x.status==='pending'); if(!r) return; r.status=accept?'accepted':'rejected'; save(); if(accept){ if(!m.share.code) publishShareCode(m); else { toast('수락 · 코드 '+m.share.code,'ok'); copy(m.share.code,'공유 코드'); } } else toast('거절했습니다'); render(); }

async function downloadAllModelAssets(m){
  if(!needLogin('전체 다운로드는 로그인이 필요합니다.')) return;
  ensureModelFields(m); if(!isModelOwner(m)){ toast('소유자만 전체 작품을 받을 수 있습니다','err'); return; }
  const safe=(m.name||'model').replace(/[\\\\/:*?"<>|]+/g,'_').slice(0,40); const files=[];
  files.push({ name:safe+'/model.json', blob:new Blob([JSON.stringify({name:m.name,faceId:m.faceId,faceSeed:m.faceSeed,facePrompt:m.facePrompt,ownerKey:m.ownerKey,share:m.share,assets:(m.assets||[]).map(a=>({id:a.id,type:a.type,prompt:a.prompt,provider:a.provider,at:a.at,by:a.by}))},null,2)],{type:'application/json'}) });
  try{ let b=await idbAssetGet('face-'+m.id); if(!b){ const src=m.faceRef||(m.photos&&m.photos[0]); if(src){ if(String(src).startsWith('data:')) b=await (await fetch(src)).blob(); else { try{ b=await fetchAsBlob(src);}catch(e){} } } } if(b) files.push({ name:safe+'/face.jpg', blob:b }); }catch(e){}
  for(let i=0;i<(m.assets||[]).length;i++){ const a=m.assets[i]; let blob=null; if(a.blobKey){ try{ blob=await idbAssetGet(a.blobKey);}catch(e){} } if(!blob&&a.dataUrl){ try{ if(String(a.dataUrl).startsWith('data:')) blob=await (await fetch(a.dataUrl)).blob(); else blob=await fetchAsBlob(a.dataUrl);}catch(e){} } if(!blob) continue; const ext=a.type==='video'?'mp4':((blob.type||'').includes('png')?'png':'jpg'); files.push({ name:safe+'/assets/'+String(i+1).padStart(2,'0')+'-'+a.id+'.'+ext, blob }); }
  if(files.length<=1){ toast('받을 작품이 없습니다','err'); return; }
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  try{
    if(isIOS && _shareFiles){ const fileList=files.map(f=>new File([f.blob], f.name.split('/').pop(), {type:f.blob.type||'application/octet-stream'})); await _shareFiles(fileList, m.name||safe, '모델 작품 전체'); toast('공유/저장 시트로 저장하세요','ok'); }
    else { const zipBlob=await zipStore(files); if(_saveBlob) await _saveBlob(safe+'-assets.zip', zipBlob, 'application/zip'); else { const a=document.createElement('a'); a.href=URL.createObjectURL(zipBlob); a.download=safe+'-assets.zip'; a.click(); } toast('전체 작품 ZIP 저장됨','ok'); }
  }catch(e){ if(e&&e.name==='AbortError') toast('저장 취소'); else toast('전체 다운로드 실패: '+(e.message||e),'err'); }
}

function openStudioForModel(m, mode){
  if(!needLogin('추가 생성에는 로그인이 필요합니다.')) return;
  ensureModelFields(m); studioState.attachToModelId=m.id; studioState.mode=mode||'add-image';
  studioState.prompt=m.facePrompt||DEFAULT_PROMPT;
  if(mode==='add-image') studioState.prompt=photorealPrompt(m.facePrompt||DEFAULT_PROMPT, 'same identity as previous portrait, consistent face, same person, new pose or expression, adult only');
  else if(mode==='add-video'){ studioState.prompt=photorealPrompt(m.facePrompt||DEFAULT_PROMPT, 'short portrait clip, same identity, subtle natural motion, adult only'); const cfg=loadStudioCfg(); if(cfg.higgsCredentials&&cfg.higgsCredentials.indexOf(':')>=0) studioState.provider='higgsfield'; else toast('영상은 Higgsfield 키가 필요합니다'); }
  go('studio');
}

function renderStudio(app){
  const cfg=loadStudioCfg(); if(!studioState._init){ studioState.provider=cfg.defaultProvider||'pollinations'; studioState._init=true; }
  const root=document.createElement('div'); root.className='studio';
  const head=document.createElement('div'); head.className='studio-head';
  head.innerHTML='<h1>AI 얼굴 생성 스튜디오</h1><p>내 AI(Pollinations/Fal/Higgsfield)로 성인 실사 얼굴을 만들고 저장·재사용하세요. 공유는 공유 코드(로컬 JSON 팩)로 이뤄지며, 같은 얼굴 아래 작품을 무제한 추가할 수 있습니다.</p>';
  root.appendChild(head);
  if(studioState.attachToModelId!=null){ const am=DB.models.find(x=>x.id===studioState.attachToModelId); const banner=document.createElement('div'); banner.className='alert info'; banner.style.marginBottom='14px'; banner.innerHTML=am?('<b>같은 얼굴로 추가 생성</b><span> — 「'+am.name+'」(faceSeed '+(am.faceSeed||'?')+') · '+(studioState.mode==='add-video'?'짧은 영상':'이미지')+'</span>'):'<b>연결 모델 없음</b>'; root.appendChild(banner); if(!am){ studioState.attachToModelId=null; studioState.mode='face'; } }

  const grid=document.createElement('div'); grid.className='studio-grid';
  const left=document.createElement('div'); left.className='studio-panel';
  left.innerHTML='<h2>생성 설정</h2>';
  const lp=document.createElement('label'); lp.className='fl'; lp.textContent='엔진'; left.appendChild(lp);
  const psel=document.createElement('select'); psel.className='inp';
  [['pollinations','Pollinations Flux (무료)'],['fal-flux','Fal Flux'],['fal-sdxl','Fal SDXL'],['higgsfield','Higgsfield'],['demo','데모(오프라인)']].forEach(([v,t])=>{ const o=document.createElement('option'); o.value=v; o.textContent=t; if(studioState.provider===v)o.selected=true; psel.appendChild(o); });
  psel.onchange=()=>{ studioState.provider=psel.value; render(); }; left.appendChild(psel);
  if(studioState.provider==='higgsfield'){ const note=document.createElement('div'); note.className='alert info'; note.style.marginTop='10px'; const has=!!(cfg.higgsCredentials&&cfg.higgsCredentials.indexOf(':')>=0); note.innerHTML=has?'<b>연동 준비됨</b><span> — 이미지/짧은 영상 요청</span>':'<b>키 필요</b><span> — 설정에서 key-id:key-secret 저장</span>'; left.appendChild(note); }
  const lpr=document.createElement('label'); lpr.className='fl'; lpr.textContent='프롬프트 (영문 · 성인 실사)'; left.appendChild(lpr);
  const ta=document.createElement('textarea'); ta.className='inp'; ta.style.minHeight='110px'; ta.placeholder=DEFAULT_PROMPT; ta.value=studioState.prompt; ta.oninput=()=>{ studioState.prompt=ta.value; }; left.appendChild(ta);
  const pret=document.createElement('div'); pret.className='studio-presets'; STUDIO_PRESETS.forEach(pr=>{ const b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=pr.ko; b.onclick=()=>{ studioState.prompt=pr.prompt; studioState.gender=pr.gender; studioState.age=pr.age; studioState.style=pr.style; studioState.base=pr.base; render(); }; pret.appendChild(b); }); left.appendChild(pret);
  const row=document.createElement('div'); row.className='two';
  function mkSel(label,key,map){ const w=document.createElement('div'); const l=document.createElement('label'); l.className='fl'; l.textContent=label; w.appendChild(l); const s=document.createElement('select'); s.className='inp'; (Array.isArray(map)?map.map(x=>[x,x]):Object.keys(map).map(k=>[k,map[k]])).forEach(([v,t])=>{ const o=document.createElement('option'); o.value=v; o.textContent=t; if(studioState[key]===v)o.selected=true; s.appendChild(o); }); s.onchange=()=>{ studioState[key]=s.value; }; w.appendChild(s); return w; }
  row.appendChild(mkSel('성별','gender',GENDERS)); row.appendChild(mkSel('연령','age',AGES)); left.appendChild(row);
  const row2=document.createElement('div'); row2.className='two'; row2.appendChild(mkSel('스타일','style',{real:'실사'})); row2.appendChild(mkSel('베이스','base',BASES)); left.appendChild(row2);
  const lmn=document.createElement('label'); lmn.className='fl'; lmn.textContent='모델 이름'; left.appendChild(lmn);
  const inm=document.createElement('input'); inm.className='inp'; inm.placeholder='비우면 자동'; inm.value=studioState.modelName; inm.oninput=()=>{ studioState.modelName=inm.value; }; left.appendChild(inm);
  const cons=document.createElement('div'); cons.className='alert info'; cons.style.marginTop='12px'; cons.innerHTML='<b>합성 · 성인만</b><span> — 실존 인물 재현 금지. 프롬프트는 실사 성향으로 보정됩니다.</span>'; left.appendChild(cons);
  const acts=document.createElement('div'); acts.className='studio-actions';
  const gen=document.createElement('button'); gen.className='btn'; gen.textContent=studioState.busy?'생성 중…':'생성하기'; gen.disabled=!!studioState.busy; gen.onclick=()=>runStudioGenerate();
  const setb=document.createElement('button'); setb.className='btn ghost'; setb.textContent='설정(API 키)'; setb.onclick=openStudioSettings;
  acts.appendChild(gen); acts.appendChild(setb); left.appendChild(acts);
  const tip=document.createElement('p'); tip.className='studio-note'; tip.textContent='키는 facenaru.studio.v1 · 공유는 공유 코드(로컬). 클라우드 동기화는 백엔드 필요.'; left.appendChild(tip);

  const right=document.createElement('div'); const rp=document.createElement('div'); rp.className='studio-panel';
  rp.innerHTML='<h2>미리보기</h2>';
  const prev=document.createElement('div'); prev.className='studio-preview';
  if(studioState.last&&studioState.last.url){ if(studioState.last.isVideo){ const v=document.createElement('video'); v.src=studioState.last.url; v.controls=true; v.playsInline=true; prev.appendChild(v); } else { const im=document.createElement('img'); im.src=studioState.last.url; im.alt='결과'; im.referrerPolicy='no-referrer'; im.loading='lazy'; im.onerror=()=>{ prev.textContent=''; const ph=document.createElement('div'); ph.className='ph'; ph.textContent='이미지를 불러오지 못했습니다.'; prev.appendChild(ph); }; prev.appendChild(im); } }
  else { const ph=document.createElement('div'); ph.className='ph'; ph.textContent='프롬프트를 입력하고 생성하기를 누르면\\n여기에 결과가 표시됩니다.'; prev.appendChild(ph); }
  rp.appendChild(prev);
  if(studioHistory.length){ const hist=document.createElement('div'); hist.className='studio-hist'; studioHistory.forEach(it=>{ const b=document.createElement('button'); b.type='button'; b.style.backgroundImage='url("'+String(it.url).replace(/"/g,'%22')+'")'; if(studioState.last&&studioState.last.id===it.id) b.className='on'; b.onclick=()=>{ studioState.last=it; studioState.prompt=it.prompt; studioState.provider=it.provider; render(); }; hist.appendChild(b); }); rp.appendChild(hist); }
  const acts2=document.createElement('div'); acts2.className='studio-actions';
  const saveBtn=document.createElement('button'); saveBtn.className='btn'; saveBtn.style.flex='1'; saveBtn.textContent=studioState.attachToModelId!=null?'이 얼굴에 작품 추가':'내 모델로 저장'; saveBtn.disabled=!studioState.last; saveBtn.onclick=()=>saveStudioAsModel();
  const clearAtt=document.createElement('button'); clearAtt.className='btn ghost'; clearAtt.textContent='새 얼굴로'; clearAtt.onclick=()=>{ studioState.attachToModelId=null; studioState.mode='face'; render(); };
  acts2.appendChild(saveBtn); if(studioState.attachToModelId!=null) acts2.appendChild(clearAtt); rp.appendChild(acts2); right.appendChild(rp);
  grid.appendChild(left); grid.appendChild(right); root.appendChild(grid); app.appendChild(root);
}

function renderModelAssetsSection(left, m){
  ensureModelFields(m);
  const s=document.createElement('div'); s.className='sec';
  s.innerHTML='<h2>이 인물로 만든 작품</h2>';
  const note=document.createElement('div'); note.className='sharebox'; note.textContent='같은 faceId/faceSeed로 통일된 캐릭터 작품입니다. 공유는 서버가 아니라 공유 코드(로컬 팩)로 동작합니다.'; s.appendChild(note);
  const row=document.createElement('div'); row.className='studio-actions'; row.style.marginTop='12px';
  const isOwner=isModelOwner(m);
  if(m.aiStudio||m.faceId){
    const b1=document.createElement('button'); b1.className='btn'; b1.textContent='같은 얼굴로 이미지 추가'; b1.onclick=()=>openStudioForModel(m,'add-image'); row.appendChild(b1);
    const b2=document.createElement('button'); b2.className='btn ghost'; b2.textContent='같은 얼굴로 짧은 영상';
    b2.onclick=()=>{ const cfg=loadStudioCfg(); if(!(cfg.higgsCredentials&&cfg.higgsCredentials.indexOf(':')>=0)){ toast('Higgsfield 키가 필요합니다','err'); return; } openStudioForModel(m,'add-video'); }; row.appendChild(b2);
  }
  if(isOwner&&(m.aiStudio||(m.assets&&m.assets.length))){
    const b3=document.createElement('button'); b3.className='btn ghost'; b3.textContent='공유 코드 만들기'; b3.onclick=()=>publishShareCode(m); row.appendChild(b3);
    const b4=document.createElement('button'); b4.className='btn ghost'; b4.textContent='이 모델 전체 다운로드'; b4.onclick=()=>downloadAllModelAssets(m); row.appendChild(b4);
  } else if(DB.user&&m.share&&m.share.code){ const b5=document.createElement('button'); b5.className='btn ghost'; b5.textContent='공유 요청'; b5.onclick=()=>requestShareAccess(m); row.appendChild(b5); }
  s.appendChild(row);
  if(isOwner&&(m.share.requests||[]).some(r=>r.status==='pending')){ const rl=document.createElement('div'); rl.className='reqlist'; m.share.requests.filter(r=>r.status==='pending').forEach(r=>{ const it=document.createElement('div'); it.className='reqitem'; const t=document.createElement('span'); t.textContent=r.from+' 님 요청 · '+_dstr(r.at); const ok=document.createElement('button'); ok.className='btn sm'; ok.textContent='수락'; ok.onclick=()=>respondShareRequest(m,r.fromKey,true); const no=document.createElement('button'); no.className='btn ghost sm'; no.textContent='거절'; no.onclick=()=>respondShareRequest(m,r.fromKey,false); it.appendChild(t); it.appendChild(ok); it.appendChild(no); rl.appendChild(it); }); s.appendChild(rl); }
  if(m.share&&m.share.code){ const sc=document.createElement('div'); sc.className='sharebox'; sc.innerHTML='공유 코드 <b style="color:var(--tx)">'+m.share.code+'</b> — 상대가 코드를 입력하면 얼굴을 재생성하지 않고 가져옵니다.'; s.appendChild(sc); }
  if(m.assets&&m.assets.length){ const g=document.createElement('div'); g.className='assetgrid'; m.assets.slice().reverse().forEach(a=>{ const cell=document.createElement('div'); cell.className='assetcell'; const badge=document.createElement('span'); badge.className='badge'; badge.textContent=a.type==='video'?'영상':'이미지'; cell.appendChild(badge); const th=document.createElement('div'); th.className='thumb'; const src=a.thumb||a.dataUrl||''; if(a.type==='video'&&a.dataUrl&&!String(a.dataUrl).startsWith('data:image')){ th.style.cssText='display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;font-weight:700'; th.textContent='▶ 영상'; cell.onclick=()=>{ if(a.dataUrl) window.open(a.dataUrl,'_blank'); }; } else { th.style.backgroundImage='url("'+String(src).replace(/"/g,'%22')+'")'; cell.onclick=()=>{ if(a.dataUrl) window.open(a.dataUrl,'_blank'); }; } cell.appendChild(th); const meta=document.createElement('div'); meta.className='meta'; meta.textContent=(a.provider||'')+' · '+(a.by||'')+' · '+_dstr(a.at); cell.appendChild(meta); g.appendChild(cell); }); s.appendChild(g); }
  else { const e=document.createElement('div'); e.style.cssText='margin-top:12px;font-size:13px;color:var(--dim)'; e.textContent='아직 작품이 없습니다. AI 스튜디오에서 얼굴을 저장하면 여기에 쌓입니다.'; s.appendChild(e); }
  left.appendChild(s);
}


$('q').addEventListener('input', e=>{ filt.q=e.target.value; if(view!=='browse') view='browse'; render(); });

runDailyAuto(false);   /* 접속 시 하루 1회 자동 등록 */
render();
</script>
