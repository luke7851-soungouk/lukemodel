<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data: blob: https: http:; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://accounts.google.com https://apis.google.com https://t1.kakaocdn.net https://developers.kakao.com https://static.nid.naver.com; connect-src https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com https://kauth.kakao.com https://kapi.kakao.com https://nid.naver.com https://openapi.naver.com; frame-src https://accounts.google.com https://kauth.kakao.com https://nid.naver.com; form-action https://accounts.google.com https://kauth.kakao.com https://nid.naver.com; base-uri 'none'; frame-ancestors 'none'">
<title>페이스루크 — 얼굴 모델 전문 공유 플랫폼</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--panel:#1a1d27;--panel2:#151822;--line:#2b3040;--tx:#e6e8ef;--dim:#8b93a7;
 --acc:#4f7cff;--ok:#7de2a8;--warn:#ffb86c;--bad:#ff6b6b;--gold:#ffc861}
body{font-family:'Pretendard','Malgun Gothic','Segoe UI',sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:1220px;margin:0 auto;padding:0 22px}

header{position:sticky;top:0;z-index:50;background:rgba(15,17,23,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:16px;height:60px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.4px}
.logo .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#4f7cff,#9b5cff);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
nav.top{display:flex;gap:4px}
nav.top button{padding:7px 13px;border-radius:7px;font-size:13.5px;color:var(--dim);font-weight:600}
nav.top button:hover{background:var(--panel);color:var(--tx)}
nav.top button.on{background:var(--panel);color:#fff}
.search{flex:1;max-width:330px;margin-left:auto;position:relative}
.search input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 13px 9px 34px;font-size:13.5px;outline:none}
.search input:focus{border-color:var(--acc)}
.search .ic{position:absolute;left:11px;top:9px;color:var(--dim);font-size:13px}
.btn{background:var(--acc);color:#fff;font-weight:700;font-size:13.5px;padding:9px 15px;border-radius:9px;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--tx)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.me{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 11px 5px 6px;font-size:13px;font-weight:600}
.me img{width:22px;height:22px;border-radius:50%}

.banner{background:linear-gradient(100deg,#1b2340,#221a3a);border:1px solid #33406b;border-radius:13px;padding:17px 20px;margin:20px 0 4px;display:flex;align-items:center;gap:16px}
.banner .t{flex:1}
.banner h2{font-size:15.5px;font-weight:800;margin-bottom:4px}
.banner p{font-size:12.8px;color:#b9c4e4;line-height:1.6}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:18px 0 14px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:600}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 11px;font-size:12.5px;font-weight:600;outline:none}
.divider{width:1px;height:20px;background:var(--line);margin:0 2px}
.seclabel{font-size:12px;font-weight:800;color:var(--dim);letter-spacing:.7px;margin:18px 0 12px;display:flex;align-items:center;gap:9px}
.seclabel .ln{flex:1;height:1px;background:var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:16px;padding-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .13s,border-color .13s}
.card:hover{transform:translateY(-3px);border-color:#3f4660}
.cover{height:214px;position:relative;background:#14171f center/cover no-repeat;display:flex;align-items:flex-end;padding:9px}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(8,10,16,.55);color:#fff;font-size:16px;z-index:2;line-height:1}
.heart.on{color:#ff7a9a}
.heart:hover{background:rgba(8,10,16,.75)}
.favbtn{width:100%;margin-top:8px;padding:10px;border-radius:9px;font-weight:700;font-size:13.5px;border:1px solid var(--line);background:var(--panel);color:var(--tx)}
.favbtn.on{border-color:#ff7a9a;color:#ff7a9a}
.minehead{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px 20px;margin:18px 0 14px}
.minehead img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.minehead h2{font-size:18px;font-weight:800;margin:0 0 4px}
.minehead p{font-size:12.8px;color:var(--dim);line-height:1.55}
.minetabs{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
.minetabs button{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700}
.minetabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:5px;background:rgba(0,0,0,.66);color:#fff}
.tag.new{background:#2f9e6e}.tag.pend{background:var(--warn);color:#241a06}
.tag.syn{background:#6c5ce7}.tag.self{background:#2f7fd4}.tag.cons{background:#2f9e6e}
.cbody{padding:11px 12px 12px}
.cbody h3{font-size:13.8px;font-weight:700;line-height:1.35;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:37px}
.stars{color:var(--gold);font-size:11.5px;letter-spacing:.5px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--dim);margin-top:5px}
.who{display:flex;align-items:center;gap:5px}
.av{width:16px;height:16px;border-radius:50%}

.detail{padding:20px 0 60px;display:grid;grid-template-columns:1fr 346px;gap:26px;align-items:start}
.hero{height:390px;border-radius:12px;background:#14171f center/cover no-repeat;margin-bottom:10px}
.angles{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:22px}
.angles .a{border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;background:#14171f center/cover no-repeat;height:78px;position:relative}
.angles .a.on{border-color:var(--acc)}
.angles .a span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);font-size:9.5px;font-weight:700;text-align:center;padding:2.5px 0}
h1.tit{font-size:25px;font-weight:800;letter-spacing:-.5px;margin-bottom:9px;line-height:1.3}
.byline{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--dim);margin-bottom:18px;flex-wrap:wrap}
.sec{margin-bottom:26px}
.sec h2{font-size:13px;font-weight:800;color:var(--dim);letter-spacing:.6px;margin-bottom:11px}
.desc{font-size:14px;line-height:1.85;color:#c9cfe0;white-space:pre-wrap}
.facegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.fcell{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.fcell .k{font-size:11px;color:var(--dim);font-weight:700;margin-bottom:3px}
.fcell .v{font-size:13.5px;font-weight:700}

.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vtabs{display:flex;gap:2px;padding:9px 9px 0;overflow-x:auto}
.vtabs button{padding:8px 13px;font-size:12.5px;font-weight:700;color:var(--dim);border-radius:7px 7px 0 0;white-space:nowrap}
.vtabs button.on{background:var(--panel2);color:#fff}
.vbody{background:var(--panel2);padding:15px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:12.8px}
.kv .k{color:var(--dim)}
.kv .v{text-align:right;font-weight:600}
.dlstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.dlstat div{background:#1e2230;border:1px solid var(--line);border-radius:9px;padding:10px 6px;text-align:center}
.dlstat .n{font-size:17px;font-weight:800;letter-spacing:-.5px}
.dlstat .l{font-size:10.5px;color:var(--dim);font-weight:700;margin-top:2px}
.words{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.word{background:#232838;border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:11.5px;font-family:Consolas,monospace;cursor:pointer;color:var(--warn)}
.file{background:#1e2230;border:1px solid var(--line);border-radius:9px;padding:11px;margin-top:11px}
.fhead{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.fname{font-size:12.3px;font-weight:700;word-break:break-all}
.fsize{font-size:11.5px;color:var(--dim);flex-shrink:0}
.scan{display:flex;gap:6px;font-size:11.3px;font-weight:700;padding:5px 8px;border-radius:6px;margin-top:6px}
.scan.ok{background:#1b3a2a;color:var(--ok)}
.scan.pend{background:#3a2f1b;color:var(--warn)}
.hash{font-family:Consolas,monospace;font-size:10.2px;color:var(--dim);margin-top:6px;word-break:break-all}
.dlbtn{width:100%;padding:12px;border-radius:9px;font-weight:800;font-size:14px;margin-top:13px;background:var(--acc);color:#fff}
.dlbtn:disabled{background:#2b3040;color:#6b7386;cursor:not-allowed}
.dlbtn.login{background:#2f9e6e}
.freetag{text-align:center;font-size:11.3px;color:var(--ok);font-weight:700;margin-top:8px}

/* 리뷰 */
.rsum{display:flex;gap:22px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px 20px;margin-bottom:14px}
.rbig{text-align:center;flex-shrink:0}
.rbig .n{font-size:34px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.rbig .s{color:var(--gold);font-size:13px;margin-top:4px}
.rbig .c{font-size:11.5px;color:var(--dim);margin-top:3px}
.rbars{flex:1}
.rbar{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);margin-bottom:3px}
.rbar .t{width:22px}
.rbar .track{flex:1;height:6px;background:#232838;border-radius:3px;overflow:hidden}
.rbar .track i{display:block;height:100%;background:var(--gold)}
.rbar .cnt{width:26px;text-align:right}
.rev{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:9px}
.rhead{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.rhead .nm{font-size:12.8px;font-weight:700}
.rhead .st{color:var(--gold);font-size:11.5px}
.rhead .dt{font-size:11.3px;color:var(--dim);margin-left:auto}
.rtext{font-size:13.3px;line-height:1.75;color:#c9cfe0;white-space:pre-wrap}
.rform{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px;margin-bottom:14px}
.rstars{display:flex;gap:3px;margin-bottom:10px}
.rstars button{font-size:23px;color:#3a4055;line-height:1}
.rstars button.on{color:var(--gold)}

.up{max-width:730px;padding:24px 0 70px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.step h2{font-size:15px;font-weight:800;margin-bottom:4px}
.step .hint{font-size:12.3px;color:var(--dim);margin-bottom:14px;line-height:1.65}
label.fl{display:block;font-size:12.3px;font-weight:700;color:var(--dim);margin:13px 0 6px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;outline:none}
.inp:focus{border-color:var(--acc)}
textarea.inp{min-height:92px;resize:vertical;line-height:1.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.drop{border:2px dashed var(--line);border-radius:11px;padding:30px;text-align:center;cursor:pointer}
.drop:hover{border-color:var(--acc);background:#171b26}
.drop .big{font-size:14.5px;font-weight:700;margin-bottom:5px}
.drop .sm{font-size:12.3px;color:var(--dim);line-height:1.7}
.alert{border-radius:9px;padding:12px 14px;font-size:12.6px;line-height:1.7;margin-top:12px}
.alert.err{background:#2e1a1a;border:1px solid #5a2a2a;color:#ffb3b3}
.alert.ok{background:#152e22;border:1px solid #2a5a42;color:#b3ffd6}
.alert.info{background:#1a2333;border:1px solid #2a3f5a;color:#b3d1ff}
.alert.warn{background:#2e2615;border:1px solid #5a4a2a;color:#ffdca8}
.alert b{color:#fff}
.prog{height:5px;background:#232838;border-radius:3px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.consent{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.copt{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:13px;cursor:pointer;text-align:left}
.copt.on{border-color:var(--acc);background:#1b2238}
.copt .t{font-size:13px;font-weight:700;margin-bottom:4px}
.copt .d{font-size:11.3px;color:var(--dim);line-height:1.55}
.anglePrev{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:11px}
.anglePrev div{height:66px;border-radius:7px;background:#14171f center/cover no-repeat;position:relative}
.anglePrev span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);font-size:9px;font-weight:700;text-align:center;padding:2px 0}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}

.sbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:9px;padding:11px 14px;font-weight:700;font-size:13.5px;margin-bottom:8px;border:1px solid transparent}
.sbtn.google{background:#fff;color:#1f1f1f;border-color:#dadce0}
.sbtn.google:hover{background:#f7f8fa}
.sbtn.kakao{background:#fee500;color:#191919}
.sbtn.kakao:hover{filter:brightness(.97)}
.sbtn.naver{background:#03c75a;color:#fff}
.sbtn.naver:hover{filter:brightness(1.05)}
.or{display:flex;align-items:center;gap:10px;margin:14px 0 8px;color:var(--dim);font-size:11.5px;font-weight:700}
.or:before,.or:after{content:'';flex:1;height:1px;background:var(--line)}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;width:100%;max-width:420px}
.mbox h2{font-size:19px;font-weight:800;margin-bottom:6px}
.mbox p{font-size:12.8px;color:var(--dim);line-height:1.7;margin-bottom:16px}
.empty{text-align:center;padding:66px 20px;color:var(--dim)}
.empty .big{font-size:16px;font-weight:700;color:var(--tx);margin-bottom:7px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#232838;border:1px solid var(--line);border-radius:10px;padding:12px 20px;font-size:13.3px;font-weight:600;z-index:200;transition:transform .22s;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:#2a5a42}.toast.err{border-color:#5a2a2a}
.back{font-size:13px;color:var(--dim);font-weight:600;padding:16px 0 0;display:inline-block}
@media(max-width:900px){.detail{grid-template-columns:1fr}.side{position:static}.facegrid{grid-template-columns:repeat(2,1fr)}}

/* ===== 모바일 대응 =====================================================
   760px 이하: 헤더를 3단 그리드로 재배치, 카드 2열, 상세 1열
   380px 이하: 카드 1열, 각도 썸네일 2열
   입력 폰트는 16px 이상으로 둔다 (iOS 사파리가 16px 미만 입력에 자동 확대를 건다) */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
@media (max-width:760px){
  .wrap{padding:0 14px}
  .hbar{height:auto;padding:10px 0;display:grid;grid-template-columns:1fr auto;
        grid-template-areas:"logo auth" "search search" "nav nav";gap:9px;align-items:center}
  .logo{grid-area:logo;font-size:16px}
  #auth{grid-area:auth;justify-self:end}
  .search{grid-area:search;max-width:none;margin:0}
  .search input{font-size:16px;padding:10px 13px 10px 34px}
  .search .ic{top:10px}
  nav.top{grid-area:nav;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  nav.top button{flex:0 0 auto;padding:8px 13px}
  .btn{padding:9px 12px;font-size:13px}
  .btn.sm{padding:7px 10px;font-size:12px}
  .me{padding:4px 9px 4px 5px;font-size:12.5px}
  .me img{width:20px;height:20px}

  .banner{flex-direction:column;align-items:stretch;gap:12px;padding:15px 16px;margin:14px 0 2px}
  .banner .btn{width:100%}

  .filters{gap:7px;padding:14px 0 10px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .filters>*{flex:0 0 auto}
  .divider{display:none}

  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .cover{height:152px;padding:7px}
  .tag{font-size:9.5px;padding:2.5px 6px}
  .cbody{padding:9px 10px 10px}
  .cbody h3{font-size:12.6px;min-height:34px;margin-bottom:4px}
  .stars{font-size:10.4px}
  .meta{font-size:10.5px;margin-top:4px}

  .detail{grid-template-columns:1fr;gap:18px;padding:12px 0 50px}
  h1.tit{font-size:20px}
  .byline{font-size:12px;margin-bottom:14px}
  .hero{height:300px}
  .angles{grid-template-columns:repeat(3,1fr);gap:7px}
  .angles .a{height:96px}
  .angles .a span{font-size:9.5px;padding:3px 0}
  .facegrid{grid-template-columns:repeat(2,1fr)}
  .side{position:static}
  .desc{font-size:13.4px}
  .sec{margin-bottom:22px}

  .rsum{flex-direction:column;align-items:stretch;gap:13px;padding:15px 16px}
  .rbig{display:flex;align-items:center;gap:11px;text-align:left}
  .rbig .n{font-size:27px}
  .rbig .s,.rbig .c{margin-top:0}
  .rev{padding:12px 13px}
  .rhead{flex-wrap:wrap;gap:6px}
  .rhead .dt{margin-left:auto}
  .rtext{font-size:12.8px}

  .up{padding:12px 0 50px}
  .step{padding:16px}
  .two,.three{grid-template-columns:1fr}
  .consent{grid-template-columns:1fr}
  .copt{padding:12px}
  .anglePrev{grid-template-columns:repeat(3,1fr);gap:7px}
  .anglePrev div{height:84px}
  .drop{padding:24px 16px}
  .inp{font-size:16px}
  .mbox{padding:22px}
  .mbox h2{font-size:18px}

  .dlstat .n{font-size:16px}
  .toast{left:14px;right:14px;transform:translateY(80px);max-width:none;text-align:center}
  .toast.show{transform:translateY(0)}
}
@media (max-width:430px){
  #auth{gap:6px}
  .me span{display:none}          /* 닉네임 숨기고 아바타만 */
  .me{padding:4px 6px}
  .btn{padding:8px 10px;font-size:12.5px}
  .btn.sm{padding:7px 9px;font-size:11.5px}
  .logo{font-size:15px}
  .logo .mark{width:23px;height:23px;font-size:11px}
  .banner h2{font-size:14.5px}
}
@media (max-width:340px){
  .grid{grid-template-columns:1fr;gap:12px}
  .cover{height:200px}
  .angles{grid-template-columns:repeat(2,1fr)}
  .anglePrev{grid-template-columns:repeat(2,1fr)}
  .facegrid{grid-template-columns:1fr}
  .hero{height:260px}
}
</style>
</head>
<body>

/* ── 저장소 ──────────────────────────────────────────────────────────── */
const KEY='facenaru.v1';
let DB = load();
function load(){
  try{ const r=localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){}
  const models = SEED.map((s,i)=>mkModel(s, i+1, Date.now()-(9-i)*DAY));
  return { models, nextId:100, poolIdx:0, lastAuto:null, user:null, saved:[], library:{} };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
function userKey(){ if(!DB.user) return null; return (DB.user.email&&DB.user.email.trim()) || DB.user.nick; }
function lib(){
  if(!DB.library) DB.library={};
  const k=userKey(); if(!k) return { favs:[], dls:[] };
  if(!DB.library[k]) DB.library[k]={ favs:[], dls:[] };
  const L=DB.library[k];
  if(!Array.isArray(L.favs)) L.favs=[];
  if(!Array.isArray(L.dls)) L.dls=[];
  return L;
}
function isFav(id){ return !!DB.user && lib().favs.indexOf(id)>=0; }
function toggleFav(id){
  if(!requireLogin('관심얼굴로 등록하려면 로그인이 필요합니다.')) return;
  const L=lib(); const i=L.favs.indexOf(id);
  if(i>=0){ L.favs.splice(i,1); toast('관심얼굴에서 뺐습니다'); }
  else { L.favs.unshift(id); toast('관심얼굴에 등록했습니다','ok'); }
  save(); render();
}
function recordDownload(id){
  const L=lib();
  L.dls=L.dls.filter(x=>x.id!==id);
  L.dls.unshift({ id, at:Date.now() });
}

function mkModel(s, id, createdAt){
  return { id, name:s.name, kind:s.kind, gender:s.gender, age:s.age, style:s.style,
    consent:s.consent, user:s.user||'auto-bot', base:s.base,
    desc:s.desc || '얼굴 모델입니다. 상세 설명은 곧 보강됩니다.',
    tags:s.tags||[], words:s.words||[], sMin:s.sMin??0.6, sMax:s.sMax??0.8, clip:s.clip??2,
    createdAt,
    angles: ANGLES.map(a=>a.k),
    file:{ name:(s.name.replace(/[^a-zA-Z0-9가-힣]/g,'_').slice(0,24))+'.safetensors',
           kb:s.kb||131072, scan:'Success',
           sha:[...Array(64)].map((_,i)=>'0123456789abcdef'[hashCode(s.name+i)%16]).join('') },
    dl:s.dl||0, log:s.log||[], reviews:s.reviews||[] };
}

/* 다운로드 카운팅: 총 / 오늘 / 최근 7일 */
function dlStats(m){
  const now=Date.now();
  const tdy = m.log.filter(t=>new Date(t).toISOString().slice(0,10)===today()).length;
  const wk  = m.log.filter(t=>now-t <= 7*DAY).length;
  return { total:m.dl, today:tdy, week:wk };
}
function avgRating(m){
  if(!m.reviews.length) return 0;
  return m.reviews.reduce((s,r)=>s+r.r,0)/m.reviews.length;
}
function starStr(v){ const f=Math.round(v); return '★★★★★'.slice(0,f)+'☆☆☆☆☆'.slice(0,5-f); }

/* ── 매일 자동 업로드 ─────────────────────────────────────────────────── */
const AUTO_PER_DAY = 3;
function runDailyAuto(force){
  if(!force && DB.lastAuto === today()) return 0;
  let added=0;
  for(let i=0;i<AUTO_PER_DAY;i++){
    const s = POOL[DB.poolIdx % POOL.length]; DB.poolIdx++;
    const m = mkModel(Object.assign({}, s, { dl:0, log:[] }), DB.nextId++, Date.now());
    m.user='auto-bot'; m.auto=true;
    DB.models.unshift(m); added++;
  }
  DB.lastAuto = today(); save();
  return added;
}

function loginSocial(provider, nick, email, photo){

  if(!nick.trim()) return toast('닉네임을 입력해주세요','err');
  loginSocial('nick', nick, email, '');
}
function loadScript(src){
  return new Promise((resolve, reject)=>{
    const hit=[...document.getElementsByTagName('script')].some(s=>s.src===src);
    if(hit) return resolve();
    const s=document.createElement('script'); s.src=src; s.async=true;
    s.onload=resolve; s.onerror=()=>reject(new Error('script'));
    document.head.appendChild(s);
  });
}
async function loginGoogle(){
  try{
    await loadScript('https://accounts.google.com/gsi/client');
    const client=google.accounts.oauth2.initTokenClient({
      client_id: AUTH.googleClientId,
      scope: 'openid email profile',
      callback: async tok=>{
        if(tok.error) return toast('구글 로그인이 취소되었습니다','err');
        const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tok.access_token}});
        const u=await r.json();
        loginSocial('google', u.name||u.email, u.email, u.picture);
      }
    });
    client.requestAccessToken();
  }catch(e){ toast('구글 로그인을 불러오지 못했습니다','err'); }
}
async function loginKakao(){
  if(!AUTH.kakaoJsKey) return toast('카카오 앱 키를 연결하면 바로 사용할 수 있습니다','err');
  try{
    await loadScript('https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js');
    if(!Kakao.isInitialized()) Kakao.init(AUTH.kakaoJsKey);
    Kakao.Auth.login({
      scope:'profile_nickname,account_email',
      success:()=>{
        Kakao.API.request({
          url:'/v2/user/me',
          success:res=>{
            const acc=res.kakao_account||{};
            const pf=acc.profile||{};
            loginSocial('kakao', pf.nickname, acc.email||'', pf.profile_image_url||'');
          },
          fail:()=>toast('카카오 프로필을 가져오지 못했습니다','err')
        });
      },
      fail:()=>toast('카카오 로그인이 취소되었습니다','err')
    });
  }catch(e){ toast('카카오 로그인을 불러오지 못했습니다','err'); }
}
async function loginNaver(){
  if(!AUTH.naverClientId) return toast('네이버 앱 키를 연결하면 바로 사용할 수 있습니다','err');

function matches(m){
  if(filt.kind && m.kind!==filt.kind) return false;
  if(filt.gender && m.gender!==filt.gender) return false;
  if(filt.age && m.age!==filt.age) return false;
  if(filt.style && m.style!==filt.style) return false;
  const q=filt.q.trim().toLowerCase();
  if(q){ const hay=(m.name+' '+m.user+' '+m.tags.join(' ')+' '+m.words.join(' ')+' '+m.base).toLowerCase();
    if(!hay.includes(q)) return false; }
  return true;
}

let draft=null;
function newDraft(){ return { name:'', kind:'FaceLORA', gender:'female', age:'twenties', style:'real',
  consent:'', base:'SDXL 1.0', desc:'', tags:'', words:'', sMin:'0.6', sMax:'0.8', clip:'2', file:null }; }

function renderUpload(app){
  if(!DB.user){
    app.appendChild(emptyBox('누구나 업로드할 수 있습니다','다만 닉네임은 필요합니다. 상단 로그인 버튼을 눌러주세요'));
    const c=document.createElement('div'); c.style.textAlign='center';
    const b=document.createElement('button'); b.className='btn'; b.textContent='로그인하고 업로드 시작';
    b.onclick=()=>openLogin('업로드하려면 닉네임이 필요합니다. 그게 전부입니다.');
    c.appendChild(b); app.appendChild(c); return;
  }
  if(!draft) draft=newDraft();
  const back=document.createElement('button'); back.className='back'; back.textContent='\u2190 모델 탐색으로'; back.onclick=()=>go('browse'); app.appendChild(back);
  const up=document.createElement('div'); up.className='up';
  const h=document.createElement('h1'); h.className='tit'; h.textContent='얼굴 모델 올리기'; h.style.marginBottom='16px'; up.appendChild(h);

  /* STEP 1 — 초상권 동의 (얼굴 전문 사이트의 필수 게이트) */
  const st0=document.createElement('div'); st0.className='step';
  const t0=document.createElement('h2'); t0.textContent='1. 초상권 확인 (필수)'; st0.appendChild(t0);
  const hint0=document.createElement('div'); hint0.className='hint';
  hint0.textContent='실존 인물의 얼굴을 동의 없이 학습한 모델은 초상권·퍼블리시티권 침해이며, 딥페이크 처벌 대상이 될 수 있습니다. 해당 없는 항목을 고르면 업로드가 진행되지 않습니다.';
  st0.appendChild(hint0);
  const cg=document.createElement('div'); cg.className='consent';
  Object.keys(CONSENT).forEach(k=>{
    const b=document.createElement('button'); b.type='button'; b.className='copt'+(draft.consent===k?' on':'');
    const t=document.createElement('div'); t.className='t'; t.textContent=CONSENT[k].ko;
    const d=document.createElement('div'); d.className='d'; d.textContent=CONSENT[k].d;
    b.appendChild(t); b.appendChild(d);
    b.onclick=()=>{ draft.consent=k; [...cg.children].forEach((x,i)=>x.className='copt'+(Object.keys(CONSENT)[i]===k?' on':'')); };
    cg.appendChild(b);
  });
  st0.appendChild(cg);
  const warn=document.createElement('div'); warn.className='alert warn';
  warn.textContent='유명인·지인 등 실존 인물을 동의 없이 학습한 모델은 신고 즉시 삭제되고 계정이 정지됩니다. 대상자 본인은 언제든 삭제를 요청할 수 있습니다.';
  st0.appendChild(warn); up.appendChild(st0);

  /* STEP 2 — 파일 */
  const st1=document.createElement('div'); st1.className='step';
  const t1=document.createElement('h2'); t1.textContent='2. 모델 파일'; st1.appendChild(t1);
  const hint1=document.createElement('div'); hint1.className='hint';
  hint1.textContent='.safetensors 형식만 받습니다. .ckpt / .pt / .bin 은 파이썬 pickle 기반이라 불러오는 순간 임의 코드가 실행될 수 있어 업로드 자체를 차단합니다.';
  st1.appendChild(hint1);
  const drop=document.createElement('div'); drop.className='drop';
  const db1=document.createElement('div'); db1.className='big'; db1.textContent='파일 선택';
  const ds1=document.createElement('div'); ds1.className='sm'; ds1.textContent='클릭해서 .safetensors 파일을 고르세요';
  drop.appendChild(db1); drop.appendChild(ds1);
  const fi=document.createElement('input'); fi.type='file'; fi.accept='.safetensors'; fi.style.display='none';
  drop.onclick=()=>fi.click(); st1.appendChild(drop); st1.appendChild(fi);
  const res=document.createElement('div'); st1.appendChild(res);
  const prog=document.createElement('div'); prog.className='prog'; prog.style.display='none';
  const pbar=document.createElement('i'); prog.appendChild(pbar); st1.appendChild(prog);

  fi.onchange=async()=>{
    const f=fi.files&&fi.files[0]; if(!f) return;
    res.textContent=''; prog.style.display='block'; pbar.style.width='8%';
    const lower=f.name.toLowerCase();
    if(!lower.endsWith('.safetensors')){
      const bad=/\.(ckpt|pt|pth|bin|pkl)$/.test(lower); prog.style.display='none';
      res.appendChild(alertBox('err','차단됨  ', bad
        ? f.name+' 은 pickle 계열 형식입니다. 로드 시 임의 코드 실행 위험이 있어 받지 않습니다. safetensors 로 변환해서 올려주세요.'
        : f.name+' 은 지원하지 않는 형식입니다. .safetensors 파일만 업로드할 수 있습니다.'));
      draft.file=null; fi.value=''; return;
    }
    pbar.style.width='30%';
    let headOk=false, headErr='';
    try{
      const head=new Uint8Array(await f.slice(0,8).arrayBuffer());
      let len=0; for(let i=7;i>=0;i--) len=len*256+head[i];
      if(len<=0||len>100*1024*1024) headErr='헤더 길이 값이 비정상입니다 ('+len+')';
      else{ const js=new TextDecoder().decode(await f.slice(8,8+Math.min(len,4096)).arrayBuffer()).trim();
        if(js[0]==='{') headOk=true; else headErr='헤더가 JSON 형식이 아닙니다'; }
    }catch(e){ headErr='파일을 읽지 못했습니다'; }
    if(!headOk){ prog.style.display='none';
      res.appendChild(alertBox('err','형식 위조 의심  ','확장자는 .safetensors 이지만 내부 구조가 규격과 맞지 않습니다. ('+headErr+')'));
      draft.file=null; fi.value=''; return; }
    pbar.style.width='58%';
    const LIMIT=64; let sha=null, why='size';
    try{ const r=await hashFile(f,LIMIT); sha=r.hash; why=r.why; }catch(e){ why='error'; }
    pbar.style.width='100%'; setTimeout(()=>{prog.style.display='none';},400);
    draft.file={ name:f.name, kb:f.size/1024, sha:sha, scan:'Pending' };
    res.appendChild(alertBox('ok','검증 통과  ', f.name+' \u00b7 '+mb(f.size/1024)+' \u00b7 safetensors 구조 확인됨'));
    if(sha){ const hh=document.createElement('div'); hh.className='hash'; hh.textContent='SHA256 '+sha+(why==='js'?'   (순수 JS 계산)':''); res.appendChild(hh); }
    else res.appendChild(alertBox('info','안내  ', LIMIT+'MB 를 넘는 파일은 브라우저에서 해시를 계산하지 않습니다. 실제 서비스에서는 서버가 계산합니다.'));
    renderAnglePreview();
  };
  up.appendChild(st1);

  /* STEP 3 — 모델 정보 + 얼굴 속성 */
  const st2=document.createElement('div'); st2.className='step';
  const t2=document.createElement('h2'); t2.textContent='3. 모델 정보'; st2.appendChild(t2);
  const hint2=document.createElement('div'); hint2.className='hint'; hint2.textContent='얼굴 속성을 정확히 채우면 탐색 필터에서 훨씬 잘 발견됩니다.';
  st2.appendChild(hint2);
  st2.appendChild(field('모델 이름','name','예: 한국인 20대 여성 실사 얼굴'));
  const r1=document.createElement('div'); r1.className='two';
  r1.appendChild(selectField('모델 종류','kind',Object.keys(KINDS).map(k=>[k,KINDS[k]])));
  r1.appendChild(selectField('베이스 모델','base',BASES.map(b=>[b,b])));
  st2.appendChild(r1);
  const r2=document.createElement('div'); r2.className='three';
  r2.appendChild(selectField('성별','gender',Object.keys(GENDERS).map(k=>[k,GENDERS[k]])));
  r2.appendChild(selectField('연령대','age',Object.keys(AGES).map(k=>[k,AGES[k]])));
  r2.appendChild(selectField('스타일','style',Object.keys(STYLES).map(k=>[k,STYLES[k]])));
  st2.appendChild(r2);
  st2.appendChild(field('모델 소개','desc','어떤 데이터로 학습했는지, 어떤 각도에서 잘 나오는지 적어주세요','textarea'));
  st2.appendChild(field('태그','tags','쉼표로 구분. 예: 한국인, 20대, 여성, 실사'));
  st2.appendChild(field('트리거 단어','words','쉼표로 구분. 예: korean_face_f20'));
  const r3=document.createElement('div'); r3.className='three';
  r3.appendChild(field('권장 강도 최소','sMin','0.6'));
  r3.appendChild(field('권장 강도 최대','sMax','0.8'));
  r3.appendChild(field('Clip Skip','clip','2'));
  st2.appendChild(r3);
  up.appendChild(st2);

  /* STEP 4 — 각도 사진 자동 생성 */
  const st3=document.createElement('div'); st3.className='step';
  const t3=document.createElement('h2'); t3.textContent='4. 각도별 사진 자동 생성'; st3.appendChild(t3);
  const hint3=document.createElement('div'); hint3.className='hint';
  hint3.textContent='별도 이미지를 올리지 않아도 됩니다. 모델 파일을 등록하면 정면·좌45·우45·좌측면·우측면·하이앵글 6방향 프리뷰가 자동으로 생성돼 상세 페이지에 붙습니다.';
  st3.appendChild(hint3);
  const prev=document.createElement('div'); prev.className='anglePrev'; st3.appendChild(prev);
  const prevNote=document.createElement('div'); prevNote.style.cssText='font-size:12px;color:var(--dim);margin-top:10px;line-height:1.6';
  st3.appendChild(prevNote);
  up.appendChild(st3);

  function renderAnglePreview(){
    prev.textContent='';
    const seed=(draft.name&&draft.name.trim())||draft.file&&draft.file.name||'preview';
    ANGLES.forEach((a,i)=>{ const d=document.createElement('div');
      d.style.backgroundImage='url("'+faceImg(seed,i,180,190)+'")';
      const s=document.createElement('span'); s.textContent=a.ko; d.appendChild(s); prev.appendChild(d); });
    prevNote.textContent = draft.file ? '6방향 프리뷰가 생성되었습니다. 등록 시 함께 저장됩니다.'
      : '모델 파일을 선택하거나 이름을 입력하면 미리보기가 나타납니다.';
  }
  renderAnglePreview();

  const actions=document.createElement('div'); actions.style.cssText='display:flex;gap:10px;justify-content:flex-end';
  const cancel=document.createElement('button'); cancel.className='btn ghost'; cancel.textContent='취소'; cancel.onclick=()=>{draft=null;go('browse');};
  const submit=document.createElement('button'); submit.className='btn'; submit.textContent='등록하고 스캔 요청'; submit.onclick=doSubmit;
  actions.appendChild(cancel); actions.appendChild(submit); up.appendChild(actions);
  app.appendChild(up);

  function field(label,key,ph,kind){
    const w=document.createElement('div');
    const l=document.createElement('label'); l.className='fl'; l.textContent=label; w.appendChild(l);
    const i=document.createElement(kind==='textarea'?'textarea':'input'); i.className='inp'; i.placeholder=ph; i.value=draft[key]||'';
    i.oninput=()=>{ draft[key]=i.value; if(key==='name') renderAnglePreview(); };
    w.appendChild(i); return w;
  }
  function selectField(label,key,opts){
    const w=document.createElement('div');
    const l=document.createElement('label'); l.className='fl'; l.textContent=label; w.appendChild(l);
    const s=document.createElement('select'); s.className='inp';
    opts.forEach(([v,t])=>{ const o=document.createElement('option'); o.value=v; o.textContent=t; if(draft[key]===v)o.selected=true; s.appendChild(o); });
    s.onchange=()=>{draft[key]=s.value;}; w.appendChild(s); return w;
  }
}
function alertBox(kind,bold,text){
  const a=document.createElement('div'); a.className='alert '+kind;
  const b=document.createElement('b'); b.textContent=bold; a.appendChild(b);
  const s=document.createElement('span'); s.textContent=text; a.appendChild(s); return a;
}

function doSubmit(){
  if(!DB.user) return openLogin();
  if(!draft.consent) return toast('초상권 확인 항목을 먼저 선택해주세요','err');
  if(!draft.name.trim()) return toast('모델 이름을 입력해주세요','err');
  if(!draft.file) return toast('모델 파일을 선택해주세요','err');
  const id=DB.nextId++;
  const m={ id, name:draft.name.trim(), kind:draft.kind, gender:draft.gender, age:draft.age, style:draft.style,
    consent:draft.consent, user:DB.user.nick, base:draft.base,
    desc:draft.desc.trim()||'설명이 없습니다.',
    tags:draft.tags.split(',').map(s=>s.trim()).filter(Boolean),
    words:draft.words.split(',').map(s=>s.trim()).filter(Boolean),
    sMin:draft.sMin?parseFloat(draft.sMin):null, sMax:draft.sMax?parseFloat(draft.sMax):null,
    clip:draft.clip?parseInt(draft.clip,10):null,
    createdAt:Date.now(), angles:ANGLES.map(a=>a.k),   /* 6방향 자동 첨부 */
    file:{ name:draft.file.name, kb:draft.file.kb, scan:'Pending', sha:draft.file.sha },
    dl:0, log:[], reviews:[] };
  DB.models.unshift(m); save();
  const file=m.file; draft=null; go('detail', id);
  toast('등록 완료 · 6방향 프리뷰 생성 및 보안 스캔을 시작합니다','ok');
  setTimeout(()=>{
    file.scan='Success';
    if(!file.sha) file.sha=[...Array(64)].map((_,i)=>'0123456789abcdef'[hashCode(m.name+i)%16]).join('');
    save(); if(view==='detail'&&curId===m.id) render();
    toast('보안 스캔 통과 · 다운로드가 열렸습니다','ok');
  }, 4000);
}

$('q').addEventListener('input', e=>{ filt.q=e.target.value; if(view!=='browse') view='browse'; render(); });

runDailyAuto(false);   /* 접속 시 하루 1회 자동 등록 */
render();
</script>
</body>
</html>
