<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data: blob: https: http:; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://accounts.google.com https://apis.google.com https://t1.kakaocdn.net https://developers.kakao.com https://static.nid.naver.com; connect-src 'self' blob: https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com https://kauth.kakao.com https://kapi.kakao.com https://nid.naver.com https://openapi.naver.com https://image.pollinations.ai https://pollinations.ai https://fal.run https://queue.fal.run https://api.fal.ai https://api.replicate.com https://*.replicate.com https://api.openai.com https://platform.higgsfield.ai https://api.higgsfield.ai https://*.higgsfield.ai https://generativelanguage.googleapis.com; media-src data: blob: https: http:; frame-src https://accounts.google.com https://kauth.kakao.com https://nid.naver.com; form-action https://accounts.google.com https://kauth.kakao.com https://nid.naver.com; base-uri 'none'; frame-ancestors 'none'">
<title>페이스루크 — 얼굴 모델 전문 공유 플랫폼</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--panel:#1a1d27;--panel2:#151822;--line:#2b3040;--tx:#e6e8ef;--dim:#8b93a7;
 --acc:#4f7cff;--ok:#7de2a8;--warn:#ffb86c;--bad:#ff6b6b;--gold:#ffc861}
body{font-family:'Pretendard','Malgun Gothic','Segoe UI',sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:1220px;margin:0 auto;padding:0 22px}

header{position:sticky;top:0;z-index:50;background:rgba(15,17,23,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:16px;height:60px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.4px}
.logo .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#4f7cff,#9b5cff);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
nav.top{display:flex;gap:4px}
nav.top button{padding:7px 13px;border-radius:7px;font-size:13.5px;color:var(--dim);font-weight:600}
nav.top button:hover{background:var(--panel);color:var(--tx)}
nav.top button.on{background:var(--panel);color:#fff}
.search{flex:1;max-width:330px;margin-left:auto;position:relative}
.search input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 13px 9px 34px;font-size:13.5px;outline:none}
.search input:focus{border-color:var(--acc)}
.search .ic{position:absolute;left:11px;top:9px;color:var(--dim);font-size:13px}
.btn{background:var(--acc);color:#fff;font-weight:700;font-size:13.5px;padding:9px 15px;border-radius:9px;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--tx)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.me{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 11px 5px 6px;font-size:13px;font-weight:600}
.me img{width:22px;height:22px;border-radius:50%}

.banner{background:linear-gradient(100deg,#1b2340,#221a3a);border:1px solid #33406b;border-radius:13px;padding:17px 20px;margin:20px 0 4px;display:flex;align-items:center;gap:16px}
.banner .t{flex:1}
.banner h2{font-size:15.5px;font-weight:800;margin-bottom:4px}
.banner p{font-size:12.8px;color:#b9c4e4;line-height:1.6}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:18px 0 14px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:600}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 11px;font-size:12.5px;font-weight:600;outline:none}
.divider{width:1px;height:20px;background:var(--line);margin:0 2px}
.seclabel{font-size:12px;font-weight:800;color:var(--dim);letter-spacing:.7px;margin:18px 0 12px;display:flex;align-items:center;gap:9px}
.seclabel .ln{flex:1;height:1px;background:var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:16px;padding-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .13s,border-color .13s}
.card:hover{transform:translateY(-3px);border-color:#3f4660}
.cover{height:214px;position:relative;background:#14171f center/cover no-repeat;display:flex;align-items:flex-end;padding:9px}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(8,10,16,.55);color:#fff;font-size:16px;z-index:2;line-height:1}
.heart.on{color:#ff7a9a}
.heart:hover{background:rgba(8,10,16,.75)}
.favbtn{width:100%;margin-top:8px;padding:10px;border-radius:9px;font-weight:700;font-size:13.5px;border:1px solid var(--line);background:var(--panel);color:var(--tx)}
.favbtn.on{border-color:#ff7a9a;color:#ff7a9a}
.minehead{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px 20px;margin:18px 0 14px}
.minehead img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.minehead h2{font-size:18px;font-weight:800;margin:0 0 4px}
.minehead p{font-size:12.8px;color:var(--dim);line-height:1.55}
.minetabs{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
.minetabs button{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700}
.minetabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:5px;background:rgba(0,0,0,.66);color:#fff}
.tag.new{background:#2f9e6e}.tag.pend{background:var(--warn);color:#241a06}
.tag.syn{background:#6c5ce7}.tag.self{background:#2f7fd4}.tag.cons{background:#2f9e6e}
.cbody{padding:11px 12px 12px}
.cbody h3{font-size:13.8px;font-weight:700;line-height:1.35;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:37px}
.stars{color:var(--gold);font-size:11.5px;letter-spacing:.5px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--dim);margin-top:5px}
.who{display:flex;align-items:center;gap:5px}
.av{width:16px;height:16px;border-radius:50%}

.detail{padding:20px 0 60px;display:grid;grid-template-columns:1fr 346px;gap:26px;align-items:start}
.hero{height:520px;border-radius:12px;background:#14171f center 8%/cover no-repeat;margin-bottom:10px;overflow:hidden;position:relative}
.angles{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:22px}
.angles .a{border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;background:#14171f center 10%/cover no-repeat;height:78px;position:relative}
.angles .a.on{border-color:var(--acc)}
.angles .a span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);font-size:9.5px;font-weight:700;text-align:center;padding:2.5px 0;z-index:2}
h1.tit{font-size:25px;font-weight:800;letter-spacing:-.5px;margin-bottom:9px;line-height:1.3}
.byline{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--dim);margin-bottom:18px;flex-wrap:wrap}
.sec{margin-bottom:26px}
.sec h2{font-size:13px;font-weight:800;color:var(--dim);letter-spacing:.6px;margin-bottom:11px}
.desc{font-size:14px;line-height:1.85;color:#c9cfe0;white-space:pre-wrap}
.facegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.fcell{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.fcell .k{font-size:11px;color:var(--dim);font-weight:700;margin-bottom:3px}
.fcell .v{font-size:13.5px;font-weight:700}

.side{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vtabs{display:flex;gap:2px;padding:9px 9px 0;overflow-x:auto}
.vtabs button{padding:8px 13px;font-size:12.5px;font-weight:700;color:var(--dim);border-radius:7px 7px 0 0;white-space:nowrap}
.vtabs button.on{background:var(--panel2);color:#fff}
.vbody{background:var(--panel2);padding:15px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:12.8px}
.kv .k{color:var(--dim)}
.kv .v{text-align:right;font-weight:600}
.dlstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.dlstat div{background:#1e2230;border:1px solid var(--line);border-radius:9px;padding:10px 6px;text-align:center}
.dlstat .n{font-size:17px;font-weight:800;letter-spacing:-.5px}
.dlstat .l{font-size:10.5px;color:var(--dim);font-weight:700;margin-top:2px}
.words{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.word{background:#232838;border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:11.5px;font-family:Consolas,monospace;cursor:pointer;color:var(--warn)}
.file{background:#1e2230;border:1px solid var(--line);border-radius:9px;padding:11px;margin-top:11px}
.fhead{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.fname{font-size:12.3px;font-weight:700;word-break:break-all}
.fsize{font-size:11.5px;color:var(--dim);flex-shrink:0}
.scan{display:flex;gap:6px;font-size:11.3px;font-weight:700;padding:5px 8px;border-radius:6px;margin-top:6px}
.scan.ok{background:#1b3a2a;color:var(--ok)}
.scan.pend{background:#3a2f1b;color:var(--warn)}
.hash{font-family:Consolas,monospace;font-size:10.2px;color:var(--dim);margin-top:6px;word-break:break-all}
.dlbtn{width:100%;padding:12px;border-radius:9px;font-weight:800;font-size:14px;margin-top:13px;background:var(--acc);color:#fff}
.dlbtn:disabled{background:#2b3040;color:#6b7386;cursor:not-allowed}
.dlbtn.login{background:#2f9e6e}
.freetag{text-align:center;font-size:11.3px;color:var(--ok);font-weight:700;margin-top:8px}

/* 리뷰 */
.rsum{display:flex;gap:22px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px 20px;margin-bottom:14px}
.rbig{text-align:center;flex-shrink:0}
.rbig .n{font-size:34px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.rbig .s{color:var(--gold);font-size:13px;margin-top:4px}
.rbig .c{font-size:11.5px;color:var(--dim);margin-top:3px}
.rbars{flex:1}
.rbar{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);margin-bottom:3px}
.rbar .t{width:22px}
.rbar .track{flex:1;height:6px;background:#232838;border-radius:3px;overflow:hidden}
.rbar .track i{display:block;height:100%;background:var(--gold)}
.rbar .cnt{width:26px;text-align:right}
.rev{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:9px}
.rhead{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.rhead .nm{font-size:12.8px;font-weight:700}
.rhead .st{color:var(--gold);font-size:11.5px}
.rhead .dt{font-size:11.3px;color:var(--dim);margin-left:auto}
.rtext{font-size:13.3px;line-height:1.75;color:#c9cfe0;white-space:pre-wrap}
.rform{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px;margin-bottom:14px}
.rstars{display:flex;gap:3px;margin-bottom:10px}
.rstars button{font-size:23px;color:#3a4055;line-height:1}
.rstars button.on{color:var(--gold)}

.up{max-width:730px;padding:24px 0 70px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.step h2{font-size:15px;font-weight:800;margin-bottom:4px}
.step .hint{font-size:12.3px;color:var(--dim);margin-bottom:14px;line-height:1.65}
label.fl{display:block;font-size:12.3px;font-weight:700;color:var(--dim);margin:13px 0 6px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;outline:none}
.inp:focus{border-color:var(--acc)}
textarea.inp{min-height:92px;resize:vertical;line-height:1.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.drop{border:2px dashed var(--line);border-radius:11px;padding:30px;text-align:center;cursor:pointer}
.drop:hover{border-color:var(--acc);background:#171b26}
.drop .big{font-size:14.5px;font-weight:700;margin-bottom:5px}
.drop .sm{font-size:12.3px;color:var(--dim);line-height:1.7}
.alert{border-radius:9px;padding:12px 14px;font-size:12.6px;line-height:1.7;margin-top:12px}
.alert.err{background:#2e1a1a;border:1px solid #5a2a2a;color:#ffb3b3}
.alert.ok{background:#152e22;border:1px solid #2a5a42;color:#b3ffd6}
.alert.info{background:#1a2333;border:1px solid #2a3f5a;color:#b3d1ff}
.alert.warn{background:#2e2615;border:1px solid #5a4a2a;color:#ffdca8}
.alert b{color:#fff}
.prog{height:5px;background:#232838;border-radius:3px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.consent{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.copt{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:13px;cursor:pointer;text-align:left}
.copt.on{border-color:var(--acc);background:#1b2238}
.copt .t{font-size:13px;font-weight:700;margin-bottom:4px}
.copt .d{font-size:11.3px;color:var(--dim);line-height:1.55}
.anglePrev{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:11px}
.anglePrev div{height:66px;border-radius:7px;background:#14171f center/cover no-repeat;position:relative}
.anglePrev span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);font-size:9px;font-weight:700;text-align:center;padding:2px 0}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}

.sbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:9px;padding:11px 14px;font-weight:700;font-size:13.5px;margin-bottom:8px;border:1px solid transparent}
.sbtn.google{background:#fff;color:#1f1f1f;border-color:#dadce0}
.sbtn.google:hover{background:#f7f8fa}
.sbtn.kakao{background:#fee500;color:#191919}
.sbtn.kakao:hover{filter:brightness(.97)}
.sbtn.naver{background:#03c75a;color:#fff}
.sbtn.naver:hover{filter:brightness(1.05)}
.or{display:flex;align-items:center;gap:10px;margin:14px 0 8px;color:var(--dim);font-size:11.5px;font-weight:700}
.or:before,.or:after{content:'';flex:1;height:1px;background:var(--line)}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;width:100%;max-width:420px}
.mbox h2{font-size:19px;font-weight:800;margin-bottom:6px}
.mbox p{font-size:12.8px;color:var(--dim);line-height:1.7;margin-bottom:16px}
.empty{text-align:center;padding:66px 20px;color:var(--dim)}
.empty .big{font-size:16px;font-weight:700;color:var(--tx);margin-bottom:7px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#232838;border:1px solid var(--line);border-radius:10px;padding:12px 20px;font-size:13.3px;font-weight:600;z-index:200;transition:transform .22s;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:#2a5a42}.toast.err{border-color:#5a2a2a}
.back{font-size:13px;color:var(--dim);font-weight:600;padding:16px 0 0;display:inline-block}
@media(max-width:900px){.detail{grid-template-columns:1fr}.side{position:static}.facegrid{grid-template-columns:repeat(2,1fr)}}

/* ===== 모바일 대응 =====================================================
   760px 이하: 헤더를 3단 그리드로 재배치, 카드 2열, 상세 1열
   380px 이하: 카드 1열, 각도 썸네일 2열
   입력 폰트는 16px 이상으로 둔다 (iOS 사파리가 16px 미만 입력에 자동 확대를 건다) */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
@media (max-width:760px){
  .wrap{padding:0 14px}
  .hbar{height:auto;padding:10px 0;display:grid;grid-template-columns:1fr auto;
        grid-template-areas:"logo auth" "search search" "nav nav";gap:9px;align-items:center}
  .logo{grid-area:logo;font-size:16px}
  #auth{grid-area:auth;justify-self:end}
  .search{grid-area:search;max-width:none;margin:0}
  .search input{font-size:16px;padding:10px 13px 10px 34px}
  .search .ic{top:10px}
  nav.top{grid-area:nav;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  nav.top button{flex:0 0 auto;padding:8px 13px}
  .btn{padding:9px 12px;font-size:13px}
  .btn.sm{padding:7px 10px;font-size:12px}
  .me{padding:4px 9px 4px 5px;font-size:12.5px}
  .me img{width:20px;height:20px}

  .banner{flex-direction:column;align-items:stretch;gap:12px;padding:15px 16px;margin:14px 0 2px}
  .banner .btn{width:100%}

  .filters{gap:7px;padding:14px 0 10px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .filters>*{flex:0 0 auto}
  .divider{display:none}

  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .cover{height:152px;padding:7px}
  .tag{font-size:9.5px;padding:2.5px 6px}
  .cbody{padding:9px 10px 10px}
  .cbody h3{font-size:12.6px;min-height:34px;margin-bottom:4px}
  .stars{font-size:10.4px}
  .meta{font-size:10.5px;margin-top:4px}

  .detail{grid-template-columns:1fr;gap:18px;padding:12px 0 50px}
  h1.tit{font-size:20px}
  .byline{font-size:12px;margin-bottom:14px}
  .hero{height:380px}
  .angles{grid-template-columns:repeat(3,1fr);gap:7px}
  .angles .a{height:96px}
  .angles .a span{font-size:9.5px;padding:3px 0}
  .facegrid{grid-template-columns:repeat(2,1fr)}
  .side{position:static}
  .desc{font-size:13.4px}
  .sec{margin-bottom:22px}

  .rsum{flex-direction:column;align-items:stretch;gap:13px;padding:15px 16px}
  .rbig{display:flex;align-items:center;gap:11px;text-align:left}
  .rbig .n{font-size:27px}
  .rbig .s,.rbig .c{margin-top:0}
  .rev{padding:12px 13px}
  .rhead{flex-wrap:wrap;gap:6px}
  .rhead .dt{margin-left:auto}
  .rtext{font-size:12.8px}

  .up{padding:12px 0 50px}
  .step{padding:16px}
  .two,.three{grid-template-columns:1fr}
  .consent{grid-template-columns:1fr}
  .copt{padding:12px}
  .anglePrev{grid-template-columns:repeat(3,1fr);gap:7px}
  .anglePrev div{height:84px}
  .drop{padding:24px 16px}
  .inp{font-size:16px}
  .mbox{padding:22px}
  .mbox h2{font-size:18px}

  .dlstat .n{font-size:16px}
  .toast{left:14px;right:14px;transform:translateY(80px);max-width:none;text-align:center}
  .toast.show{transform:translateY(0)}
}
@media (max-width:430px){
  #auth{gap:6px}
  .me span{display:none}          /* 닉네임 숨기고 아바타만 */
  .me{padding:4px 6px}
  .btn{padding:8px 10px;font-size:12.5px}
  .btn.sm{padding:7px 9px;font-size:11.5px}
  .logo{font-size:15px}
  .logo .mark{width:23px;height:23px;font-size:11px}
  .banner h2{font-size:14.5px}
}
@media (max-width:340px){
  .grid{grid-template-columns:1fr;gap:12px}
  .cover{height:200px}

/* IndexedDB — uploaded weight blobs */
const IDB_NAME='facenaru.files.v1', IDB_STORE='files';
const IDB_ASSETS='assets';
function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(IDB_NAME,2);
    r.onupgradeneeded=()=>{
      const db=r.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      if(!db.objectStoreNames.contains(IDB_ASSETS)) db.createObjectStore(IDB_ASSETS);
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
async function idbAssetPut(key, blob){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_ASSETS,'readwrite');
    tx.objectStore(IDB_ASSETS).put(blob, key);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  });
}
async function idbAssetGet(key){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const rq=db.transaction(IDB_ASSETS,'readonly').objectStore(IDB_ASSETS).get(key);
    rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error);
  });
}

    tx.objectStore(IDB_STORE).put(blob, id);
    tx.oncomplete=()=>res();
    tx.onerror=()=>rej(tx.error);
  });
}
async function idbGet(id){

    rq.onsuccess=()=>res(rq.result||null);
    rq.onerror=()=>rej(rq.error);
  });
}
/* Save a Blob as a real local file on phone/PC (picker → share → anchor → tab) */
async function saveBlobToDevice(filename, blob, mime){
  const type = mime || (blob && blob.type) || 'application/octet-stream';
  const data = blob instanceof Blob ? blob : new Blob([blob], {type});

  // 1) File System Access (Chromium desktop / Android Chrome)
  if(typeof window.showSaveFilePicker === 'function'){
    try{
      const ext = (String(filename).includes('.') ? '.'+String(filename).split('.').pop() : '');
      const opts = { suggestedName: filename };
      if(ext){
        try{ opts.types = [{ description:'File', accept:{ [type]:[ext] } }]; }catch(_){}
      }
      const handle = await window.showSaveFilePicker(opts);
      const writable = await handle.createWritable();
      await writable.write(data);
      await writable.close();
      return 'picker';
    }catch(e){
      if(e && (e.name==='AbortError')) throw e; // user cancelled
      /* fall through to share/anchor */
    }
  }

  // 2) Web Share Level 2 (iOS Safari / Android Chrome) — real Files app / share sheet
  try{
    const file = new File([data], filename, { type });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title: filename });
      return 'share';
    }
  }catch(e){
    if(e && e.name==='AbortError') throw e;
    /* fall through */
  }

  // 3) Classic <a download> (desktop browsers; some Android)
  try{
    const url = URL.createObjectURL(data);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    try{ a.type = type; }catch(_){}
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
    return 'anchor';
  }catch(e){ /* fall through */ }

  // 4) Open blob in new tab — user can Share/Save As
  const url = URL.createObjectURL(data);
  const w = window.open(url, '_blank');
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
  if(!w) throw new Error('popup blocked');
  return 'tab';
}

function modelCardJson(m){
  return JSON.stringify({
    name:m.name, kind:m.kind, base:m.base, tags:m.tags, words:m.words,
    sMin:m.sMin, sMax:m.sMax, clip:m.clip, desc:m.desc, consent:m.consent, file:m.file||null
  }, null, 2);
}

async function fetchCoverBlob(m){
  if(!(m.photos && m.photos[0])) return null;
  const r = await fetch(m.photos[0]);
  if(!r.ok) return null;
  let blob = await r.blob();
  const u = String(m.photos[0]).toLowerCase();
  let ext = 'jpg', mime = 'image/jpeg';
  if(u.endsWith('.png') || (blob.type||'').includes('png')){ ext='png'; mime='image/png'; }
  else if(u.endsWith('.webp') || (blob.type||'').includes('webp')){ ext='webp'; mime='image/webp'; }
  if(!blob.type || blob.type==='application/octet-stream') blob = new Blob([blob], {type:mime});
  return { blob, ext, mime };
}

async function shareFilesOrFallback(files, title, text){
  try{
    if(navigator.canShare && navigator.canShare({ files })){
      const payload = { files, title: title||files[0].name };
      if(text) payload.text = text;
      await navigator.share(payload);
      return 'share';
    }
  }catch(e){
    if(e && e.name==='AbortError') throw e;
  }
  let method = 'anchor';
  for(let i=0;i<files.length;i++){
    const f = files[i];
    const m = await saveBlobToDevice(f.name, f, f.type||'application/octet-stream');
    if(i===0) method = m;
    /* if first used share, remaining go through saveBlobToDevice which may share again — prefer anchor for rest */
    if(m==='share' && i===0 && files.length>1){
      for(let j=1;j<files.length;j++){
        const fj = files[j];
        const url = URL.createObjectURL(fj);
        const a = document.createElement('a');
        a.href=url; a.download=fj.name; a.rel='noopener';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 60000);
      }
      return 'share';
    }
  }
  return method;
}

async function downloadModelFile(m){
  const weights = await idbGet(m.id);
  if(weights){
    const name = (m.file && m.file.name) || ((m.name||'model')+'.safetensors');
    const method = await saveBlobToDevice(name, weights, weights.type||'application/octet-stream');
    return { kind:'weights', method };
  }

  /* Seed/catalog: save real local files (cover image + model card JSON) — NOT a zip package */
  const safeName = (m.name||'model').replace(/[\\/:*?"<>|]+/g,'_').slice(0,48);
  const cover = await fetchCoverBlob(m);
  const jsonStr = modelCardJson(m);
  const jsonBlob = new Blob([jsonStr], {type:'application/json'});
  const jsonName = safeName+'.json';
  const files = [];
  if(cover && cover.blob && cover.blob.size){
    files.push(new File([cover.blob], safeName+'.'+cover.ext, {type:cover.mime}));
  }
  files.push(new File([jsonBlob], jsonName, {type:'application/json'}));

  /* Prefer multi-file share in the same user-gesture async turn (iOS) */
  const method = await shareFilesOrFallback(files, m.name||safeName, jsonStr);
  return { kind:'files', method };
}

        });

async function loginNaver(){
  if(!AUTH.naverClientId) return toast('네이버 앱 키를 연결하면 바로 사용할 수 있습니다','err');
  const state=Math.random().toString(36).slice(2);
  const redirect=location.origin+'/naver-callback.html';
  const url='https://nid.naver.com/oauth2.0/authorize?response_type=token&client_id='+encodeURIComponent(AUTH.naverClientId)+'&redirect_uri='+encodeURIComponent(redirect)+'&state='+state;
  window.open(url,'naverLogin','width=480,height=640');
}

function matches(m){
  if(filt.kind && m.kind!==filt.kind) return false;
  if(filt.gender && m.gender!==filt.gender) return false;
  if(filt.age && m.age!==filt.age) return false;
  if(filt.style && m.style!==filt.style) return false;
  const q=filt.q.trim().toLowerCase();
  if(q){ const hay=(m.name+' '+m.user+' '+m.tags.join(' ')+' '+m.words.join(' ')+' '+m.base).toLowerCase();
    if(!hay.includes(q)) return false; }
  return true;
}

function emptyBox(t1,t2){ const e=document.createElement('div'); e.className='empty';

function gridOf(list){
  const g=document.createElement('div'); g.className='grid';
  list.forEach(m=>{
    const c=document.createElement('div'); c.className='card'; c.onclick=()=>go('detail',m.id);
    const cv=document.createElement('div'); cv.className='cover';

    const tg=document.createElement('div'); tg.className='tags';
    const t1=document.createElement('span'); t1.className='tag'; t1.textContent=KINDS[m.kind]; tg.appendChild(t1);
    const cs=CONSENT[m.consent];
    const t2=document.createElement('span'); t2.className='tag '+cs.cls; t2.textContent=cs.ko; tg.appendChild(t2);
    if(new Date(m.createdAt).toISOString().slice(0,10)===today()){
      const t3=document.createElement('span'); t3.className='tag new'; t3.textContent='오늘 등록'; tg.appendChild(t3); }
    if(m.file.scan!=='Success'){ const t4=document.createElement('span'); t4.className='tag pend'; t4.textContent='스캔 대기'; tg.appendChild(t4); }
    const ht=document.createElement('button'); ht.type='button';
    ht.className='heart'+(isFav(m.id)?' on':'');
    ht.textContent=isFav(m.id)?'♥':'♡';
    ht.title=isFav(m.id)?'관심얼굴 해제':'관심얼굴 등록';
    ht.onclick=e=>{ e.stopPropagation(); toggleFav(m.id); };
    cv.appendChild(ht);
    cv.appendChild(tg); c.appendChild(cv);
    const b=document.createElement('div'); b.className='cbody';
    const h3=document.createElement('h3'); h3.textContent=m.name; b.appendChild(h3);
    const av=avgRating(m);
    const st=document.createElement('div'); st.className='stars';
    st.textContent = m.reviews.length ? starStr(av)+'  '+av.toFixed(1)+' ('+m.reviews.length+')' : '☆☆☆☆☆  리뷰 없음';
    if(!m.reviews.length) st.style.color='var(--dim)';
    b.appendChild(st);
    const mt=document.createElement('div'); mt.className='meta';
    const who=document.createElement('div'); who.className='who';
    const ai=document.createElement('img'); ai.className='av'; ai.src=avatar(m.user); ai.alt='';
    const un=document.createElement('span'); un.textContent=m.user;
    who.appendChild(ai); who.appendChild(un);
    const dls=document.createElement('span'); dls.textContent='\u2193 '+fmt(m.dl);
    mt.appendChild(who); mt.appendChild(dls); b.appendChild(mt);
    c.appendChild(b); g.appendChild(c);
  });
  return g;
}

/* ── 업로드 ─────────────────────────────────────────────────────────── */
let draft=null;
function newDraft(){ return { name:'', kind:'FaceLORA', gender:'female', age:'twenties', style:'real',
  consent:'', base:'SDXL 1.0', desc:'', tags:'', words:'', sMin:'0.6', sMax:'0.8', clip:'2', file:null }; }

function renderUpload(app){
  if(!DB.user){
    app.appendChild(emptyBox('누구나 업로드할 수 있습니다','다만 닉네임은 필요합니다. 상단 로그인 버튼을 눌러주세요'));
    const c=document.createElement('div'); c.style.textAlign='center';
    const b=document.createElement('button'); b.className='btn'; b.textContent='로그인하고 업로드 시작';
    b.onclick=()=>openLogin('업로드하려면 닉네임이 필요합니다. 그게 전부입니다.');
    c.appendChild(b); app.appendChild(c); return;
  }
  if(!draft) draft=newDraft();
  const back=document.createElement('button'); back.className='back'; back.textContent='\u2190 모델 탐색으로'; back.onclick=()=>go('browse'); app.appendChild(back);
  const up=document.createElement('div'); up.className='up';
  const h=document.createElement('h1'); h.className='tit'; h.textContent='얼굴 모델 올리기'; h.style.marginBottom='16px'; up.appendChild(h);

  /* STEP 1 — 초상권 동의 (얼굴 전문 사이트의 필수 게이트) */
  const st0=document.createElement('div'); st0.className='step';
  const t0=document.createElement('h2'); t0.textContent='1. 초상권 확인 (필수)'; st0.appendChild(t0);
  const hint0=document.createElement('div'); hint0.className='hint';
  hint0.textContent='실존 인물의 얼굴을 동의 없이 학습한 모델은 초상권·퍼블리시티권 침해이며, 딥페이크 처벌 대상이 될 수 있습니다. 해당 없는 항목을 고르면 업로드가 진행되지 않습니다.';
  st0.appendChild(hint0);
  const cg=document.createElement('div'); cg.className='consent';
  Object.keys(CONSENT).forEach(k=>{
    const b=document.createElement('button'); b.type='button'; b.className='copt'+(draft.consent===k?' on':'');
    const t=document.createElement('div'); t.className='t'; t.textContent=CONSENT[k].ko;
    const d=document.createElement('div'); d.className='d'; d.textContent=CONSENT[k].d;
    b.appendChild(t); b.appendChild(d);
    b.onclick=()=>{ draft.consent=k; [...cg.children].forEach((x,i)=>x.className='copt'+(Object.keys(CONSENT)[i]===k?' on':'')); };
    cg.appendChild(b);
  });
  st0.appendChild(cg);
  const warn=document.createElement('div'); warn.className='alert warn';
  warn.textContent='유명인·지인 등 실존 인물을 동의 없이 학습한 모델은 신고 즉시 삭제되고 계정이 정지됩니다. 대상자 본인은 언제든 삭제를 요청할 수 있습니다.';
  st0.appendChild(warn); up.appendChild(st0);

  /* STEP 2 — 파일 */
  const st1=document.createElement('div'); st1.className='step';
  const t1=document.createElement('h2'); t1.textContent='2. 모델 파일'; st1.appendChild(t1);
  const hint1=document.createElement('div'); hint1.className='hint';
  hint1.textContent='.safetensors 형식만 받습니다. .ckpt / .pt / .bin 은 파이썬 pickle 기반이라 불러오는 순간 임의 코드가 실행될 수 있어 업로드 자체를 차단합니다.';
  st1.appendChild(hint1);
  const drop=document.createElement('div'); drop.className='drop';
  const db1=document.createElement('div'); db1.className='big'; db1.textContent='파일 선택';
  const ds1=document.createElement('div'); ds1.className='sm'; ds1.textContent='클릭해서 .safetensors 파일을 고르세요';
  drop.appendChild(db1); drop.appendChild(ds1);
  const fi=document.createElement('input'); fi.type='file'; fi.accept='.safetensors'; fi.style.display='none';
  drop.onclick=()=>fi.click(); st1.appendChild(drop); st1.appendChild(fi);
  const res=document.createElement('div'); st1.appendChild(res);
  const prog=document.createElement('div'); prog.className='prog'; prog.style.display='none';
  const pbar=document.createElement('i'); prog.appendChild(pbar); st1.appendChild(prog);

  fi.onchange=async()=>{
    const f=fi.files&&fi.files[0]; if(!f) return;
    res.textContent=''; prog.style.display='block'; pbar.style.width='8%';
    const lower=f.name.toLowerCase();
    if(!lower.endsWith('.safetensors')){
      const bad=/\.(ckpt|pt|pth|bin|pkl)$/.test(lower); prog.style.display='none';
      res.appendChild(alertBox('err','차단됨  ', bad
        ? f.name+' 은 pickle 계열 형식입니다. 로드 시 임의 코드 실행 위험이 있어 받지 않습니다. safetensors 로 변환해서 올려주세요.'
        : f.name+' 은 지원하지 않는 형식입니다. .safetensors 파일만 업로드할 수 있습니다.'));
      draft.file=null; draft.fileBlob=null; fi.value=''; return;
    }
    pbar.style.width='30%';
    let headOk=false, headErr='';
    try{
      const head=new Uint8Array(await f.slice(0,8).arrayBuffer());
      let len=0; for(let i=7;i>=0;i--) len=len*256+head[i];
      if(len<=0||len>100*1024*1024) headErr='헤더 길이 값이 비정상입니다 ('+len+')';
      else{ const js=new TextDecoder().decode(await f.slice(8,8+Math.min(len,4096)).arrayBuffer()).trim();
        if(js[0]==='{') headOk=true; else headErr='헤더가 JSON 형식이 아닙니다'; }
    }catch(e){ headErr='파일을 읽지 못했습니다'; }
    if(!headOk){ prog.style.display='none';
      res.appendChild(alertBox('err','형식 위조 의심  ','확장자는 .safetensors 이지만 내부 구조가 규격과 맞지 않습니다. ('+headErr+')'));
      draft.file=null; draft.fileBlob=null; fi.value=''; return; }
    pbar.style.width='58%';
    const LIMIT=64; let sha=null, why='size';
    try{ const r=await hashFile(f,LIMIT); sha=r.hash; why=r.why; }catch(e){ why='error'; }
    pbar.style.width='100%'; setTimeout(()=>{prog.style.display='none';},400);
    draft.file={ name:f.name, kb:f.size/1024, sha:sha, scan:'Pending' };
    draft.fileBlob=f;
    res.appendChild(alertBox('ok','검증 통과  ', f.name+' \u00b7 '+mb(f.size/1024)+' \u00b7 safetensors 구조 확인됨'));
    if(sha){ const hh=document.createElement('div'); hh.className='hash'; hh.textContent='SHA256 '+sha+(why==='js'?'   (순수 JS 계산)':''); res.appendChild(hh); }
    else res.appendChild(alertBox('info','안내  ', LIMIT+'MB 를 넘는 파일은 브라우저에서 해시를 계산하지 않습니다. 실제 서비스에서는 서버가 계산합니다.'));
    renderAnglePreview();
  };
  up.appendChild(st1);

  /* STEP 3 — 모델 정보 + 얼굴 속성 */

function normalizeConnection(c){

  const provider=String(c.provider||'').trim();
  let kind='image';

  else if(c.kind==='text') kind='text';
  if(!['pollinations','fal','replicate','higgsfield','openai','google','demo','anthropic'].includes(provider)) return null;
  if(provider==='anthropic') kind='text';
  return {
    id:String(c.id||('c'+Date.now()+Math.floor(Math.random()*9999))),
    name:String(c.name||provider).trim()||provider,
    provider,
    kind,
    model:String(c.model||'').trim(),

function mergeDefaultConnections(existing, defaults){
  const ids=new Set(existing.map(c=>c.id));
  const names=new Set(existing.map(c=>c.provider+'|'+c.kind+'|'+c.model));
  const out=existing.slice();
  defaults.forEach(d=>{
    if(ids.has(d.id)) return;
    if(names.has(d.provider+'|'+d.kind+'|'+d.model)) return;
    // keep seeded defaults available for fresh installs / upgrades
    if(['c_google_img','c_openai_img','c_claude_text','c_fal_minimax','c_fal_kling','c_fal_flux_i2i','c_fal_kling_i2v','c_rep_img','c_rep_vid','c_higgs_img','c_higgs_vid','c_poll_flux','c_demo'].includes(d.id)) out.push(d);

function sanitizeStudioPrompt(userPrompt){

function connectionKeyMissing(conn, cfg){
  if(!conn) return true;

  if(conn.provider==='fal') return !String(cfg.falKey||'').trim();
  if(conn.provider==='replicate') return !String(cfg.replicateKey||'').trim();
  if(conn.provider==='openai') return !String(cfg.openaiKey||'').trim();
  if(conn.provider==='google') return !String(cfg.googleGeminiKey||'').trim();
  if(conn.provider==='anthropic') return !String(cfg.anthropicKey||'').trim();
  if(conn.provider==='higgsfield'){ const c=String(cfg.higgsCredentials||'').trim(); return !c||c.indexOf(':')<0; }
  return true;
}
function listStudioConnections(kind, cfg){
  cfg=cfg||loadStudioCfg();

    if(!c||c.enabled===false) return false;
    if(c.kind==='text'||c.provider==='anthropic') return false; // Claude: prompt assist only, not image/video gen
    if(!kind) return c.kind==='image'||c.kind==='video';

function legacyProviderToConnectionId(provider, kind){
  const map={
    'pollinations':'c_poll_flux',

    'fal-sdxl':'c_fal_sdxl',
    'higgsfield': kind==='video'?'c_higgs_vid':'c_higgs_img',
    'demo':'c_demo',

    'replicate': kind==='video'?'c_rep_vid':'c_rep_img',
    'fal': kind==='video'?'c_fal_minimax':'c_fal_flux'
  };
  return map[provider]||null;
}
function pickDefaultConnection(kind, cfg){
  cfg=cfg||loadStudioCfg();
  const list=listStudioConnections(kind, cfg);
  if(cfg.defaultConnectionId){
    const d=list.find(c=>c.id===cfg.defaultConnectionId);
    if(d) return d;

  const legacyId=legacyProviderToConnectionId(cfg.defaultProvider||studioState.provider, kind);
  if(legacyId){ const d=list.find(c=>c.id===legacyId); if(d) return d; }
  // prefer one with key ready
  const ready=list.find(c=>!connectionKeyMissing(c,cfg));
  return ready||list[0]||null;
}

function ensureGoogleAiHubProvisioned(markFresh){
  if(!isGoogleUser()) return false;
  const before=loadStudioCfg();
  // mergeDefaultConnections via load already; force-save full defaults+keys for this Google scope
  const merged=mergeDefaultConnections((before.connections||[]).map(c=>({...c})), defaultStudioConnections());
  const wasNew=!before.hubProvisionedAt;
  const next=saveStudioCfg({
    ...before,
    connections:merged,
    hubProvisionedAt: before.hubProvisionedAt || Date.now()
  });
  if(markFresh && wasNew) return true;
  return wasNew;
}

function providerHubStatus(p, cfg){
  cfg=cfg||loadStudioCfg();
  const active=findConnection(studioState.connectionId, cfg);
  const inUse=active && (
    (p.id==='google'&&active.provider==='google')||
    (p.id==='openai'&&active.provider==='openai')||
    (p.id==='fal'&&active.provider==='fal')||
    (p.id==='replicate'&&active.provider==='replicate')||
    (p.id==='higgsfield'&&active.provider==='higgsfield')||
    (p.id==='pollinations'&&active.provider==='pollinations')||
    (p.id==='demo'&&active.provider==='demo')||
    (p.id==='anthropic'&&active.provider==='anthropic')
  );
  if(p.gen==='text'){
    const has=!connectionKeyMissing({provider:'anthropic'}, cfg);
    if(inUse) return {cls:'use', label:'사용 중'};
    return has?{cls:'ok', label:'연결됨 (텍스트)'}:{cls:'text', label:'키 필요 · 텍스트'};
  }
  if(!p.needsKey){
    if(inUse) return {cls:'use', label:'사용 중'};
    return {cls:'free', label:'연결됨 (무료)'};
  }
  const has=!connectionKeyMissing({provider:p.id==='higgsfield'?'higgsfield':p.id}, cfg);
  // higgs uses same id
  if(inUse && has) return {cls:'use', label:'사용 중'};
  if(has) return {cls:'ok', label:'연결됨'};
  return {cls:'need', label:'키 필요'};
}

async function blobToDataUrl(blob){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(blob); }); }
async function fetchAsBlob(url){ const r=await fetch(url,{mode:'cors',credentials:'omit',referrerPolicy:'no-referrer'}); if(!r.ok) throw new Error('fetch '+r.status); return await r.blob(); }

function falExtractMedia(data, wantVideo){
  if(!data) return null;
  if(wantVideo){
    const v=(data.video&&(data.video.url||data.video))||(data.output&&(data.output.video&&(data.output.video.url||data.output.video)||data.output.url))||(typeof data.output==='string'?data.output:null);
    if(v&&typeof v==='string') return v;
  }
  const img=(data.images&&data.images[0]&&(data.images[0].url||data.images[0]))||(data.image&&(data.image.url||data.image))||(data.output&&(data.output.url||(data.output.images&&data.output.images[0]&&(data.output.images[0].url||data.output.images[0]))))||null;
  if(img&&typeof img==='string') return img;
  if(!wantVideo){
    const v=(data.video&&(data.video.url||data.video));
    if(v&&typeof v==='string') return v;
  }
  return null;
}
async function studioPollFalQueue(endpoint, requestId, falKey){
  const headers={'Authorization':'Key '+falKey,'Content-Type':'application/json'};
  // also try Bearer if Key-style fails later — use Key first (fal docs)
  const statusBase='https://queue.fal.run/'+endpoint+'/requests/'+requestId;
  for(let i=0;i<90;i++){
    await new Promise(r=>setTimeout(r,2000));
    let stRes=await fetch(statusBase+'/status',{headers});
    if(stRes.status===401||stRes.status===403){
      headers.Authorization='Bearer '+falKey;
      stRes=await fetch(statusBase+'/status',{headers});
    }
    if(!stRes.ok) continue;
    const st=await stRes.json();
    const status=String(st.status||'').toUpperCase();
    if(status==='COMPLETED'||status==='OK'){
      const rRes=await fetch(statusBase,{headers});
      if(!rRes.ok) throw new Error('Fal 결과 조회 실패');
      return await rRes.json();
    }
    if(['FAILED','CANCELLED','CANCELED','ERROR'].includes(status)) throw new Error('Fal 큐 실패: '+status);
  }
  throw new Error('Fal 시간 초과');
}

function falUpgradeEndpointForFace(endpoint, wantVideo, hasRef){
  if(!hasRef) return endpoint;
  const ep=String(endpoint||'');
  if(wantVideo){
    if(/text-to-video/i.test(ep)) return ep.replace(/text-to-video/i,'image-to-video');
    if(/kling-video/i.test(ep) && !/image-to-video/i.test(ep)) return 'fal-ai/kling-video/v1/standard/image-to-video';
    return ep;
  }
  if(ep==='fal-ai/flux/dev' || ep==='fal-ai/flux/schnell') return ep+'/image-to-image';
  if(/\/flux\/dev$/.test(ep) && !/image-to-image/.test(ep)) return ep+'/image-to-image';
  return ep;
}
function falInjectFaceRef(body, endpoint, imageUrl, wantVideo){
  if(!imageUrl) return body;
  const ep=String(endpoint||'').toLowerCase();
  body=Object.assign({}, body);
  if(wantVideo || /video|minimax|kling|luma|runway/.test(ep)){
    if(/minimax/.test(ep)){ body.first_frame_image=imageUrl; if(!body.image_url) body.image_url=imageUrl; }
    else { body.image_url=imageUrl; if(!body.image) body.image=imageUrl; }
  } else if(/image-to-image|img2img|pulid|ip-adapter|face/.test(ep)){
    body.image_url=imageUrl;
    if(body.strength==null) body.strength=0.55;
    if(body.num_inference_steps==null) body.num_inference_steps=28;
  } else {
    // best-effort: many Fal image models accept image_url / image_urls
    body.image_url=imageUrl;
    body.image_urls=[imageUrl];
    if(body.strength==null) body.strength=0.55;
  }
  return body;
}
async function studioGenFal(endpoint, prompt, falKey, opts){
  opts=opts||{};
  const wantVideo=!!opts.video;
  const p=opts.raw?sanitizeStudioPrompt(prompt):photorealPrompt(prompt);
  const imageUrl=opts.refImage||opts.refUrl||null;
  endpoint=falUpgradeEndpointForFace(endpoint, wantVideo, !!imageUrl);
  let body=wantVideo?{prompt:p}:{prompt:p,image_size:'portrait_4_3',num_images:1};
  body=falInjectFaceRef(body, endpoint, imageUrl, wantVideo);
  const tryAuths=['Key '+falKey,'Bearer '+falKey];
  let lastErr=null, data=null;
  for(const auth of tryAuths){
    try{
      const res=await fetch('https://fal.run/'+endpoint,{method:'POST',headers:{'Authorization':auth,'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!res.ok){
        let msg='Fal 요청 실패 ('+res.status+')';
        try{ const j=await res.json(); if(j&&(j.detail||j.message||j.error)) msg=String(typeof j.detail==='string'?j.detail:(j.message||j.error||msg)); }catch(e){}
        lastErr=new Error(msg); continue;
      }
      data=await res.json();
      if(data&&data.request_id&&!falExtractMedia(data, wantVideo)){
        data=await studioPollFalQueue(endpoint, data.request_id, falKey);
      }
      break;
    }catch(e){ lastErr=e; }
  }
  if(!data) throw lastErr||new Error('Fal 실패');
  const url=falExtractMedia(data, wantVideo);
  if(!url) throw new Error(wantVideo?'Fal 응답에 영상 없음':'Fal 응답에 이미지 없음');
  return {url, meta:{provider:'fal',endpoint,video:wantVideo,faceRef:!!imageUrl}};
}

async function studioPollHiggs(statusUrl, headers){ for(let i=0;i<40;i++){ await new Promise(r=>setTimeout(r,1500)); const r=await fetch(statusUrl,{headers}); if(!r.ok) continue; const j=await r.json(); const st=String(j.status||'').toLowerCase(); if(st==='completed'||st==='succeeded'||st==='success'){ const url=(j.images&&j.images[0]&&(j.images[0].url||j.images[0]))||(j.output&&j.output.url)||(j.video&&(j.video.url||j.video))||null; if(!url) throw new Error('Higgsfield URL 없음'); return url; } if(['failed','canceled','cancelled','moderated','error'].includes(st)) throw new Error('Higgsfield 실패: '+st); } throw new Error('Higgsfield 시간 초과'); }

      if(immediate) return {url:immediate, meta:{provider:'higgsfield',endpoint:ep.url,video:!!asVideo,faceRef:!!imageUrl}};

async function studioGenReplicate(model, prompt, kind, opts){
  opts=opts||{};
  const cfg=loadStudioCfg();
  const key=String(cfg.replicateKey||'').trim();
  if(!key){ toast('스튜디오 설정에서 Replicate 토큰을 입력해주세요','err'); throw new Error('no-replicate-key'); }
  const p=opts.raw?sanitizeStudioPrompt(prompt):photorealPrompt(prompt);
  model=String(model||'').trim();
  if(!model) throw new Error('Replicate 모델 ID를 연결 설정에 입력해주세요 (예: black-forest-labs/flux-schnell)');
  const headers={'Authorization':'Token '+key,'Content-Type':'application/json','Prefer':'wait=60'};
  const imageUrl=opts.refImage||opts.refUrl||null;
  let startUrl, input={prompt:p};
  if(imageUrl){
    // common field names across Replicate image/video models
    input.image=imageUrl; input.image_url=imageUrl; input.input_image=imageUrl;
    if(kind==='video'){ input.start_image=imageUrl; input.first_frame_image=imageUrl; }
  }
  if(/^[0-9a-f]{64}$/i.test(model)){
    startUrl='https://api.replicate.com/v1/predictions';
    var body={version:model, input:input};
  } else {
    const parts=model.replace(/^https?:\/\/replicate\.com\//,'').split(/[:@]/);
    const ownerName=parts[0].includes('/')?parts[0]:model;
    const segs=ownerName.split('/').filter(Boolean);
    if(segs.length<2) throw new Error('Replicate 모델은 owner/name 형식이어야 합니다');
    startUrl='https://api.replicate.com/v1/models/'+encodeURIComponent(segs[0])+'/'+encodeURIComponent(segs[1])+'/predictions';
    var body={input:input};
  }
  const res=await fetch(startUrl,{method:'POST',headers,body:JSON.stringify(body)});
  if(!res.ok){ let msg='Replicate 요청 실패 ('+res.status+')'; try{ const j=await res.json(); msg=String((j&&(j.detail||j.title||j.error))||msg);}catch(e){} throw new Error(msg); }
  let data=await res.json();
  const getUrl=data.urls&&data.urls.get;
  for(let i=0;i<90;i++){
    const st=String(data.status||'').toLowerCase();
    if(st==='succeeded'){
      let out=data.output;
      if(Array.isArray(out)) out=out[0];
      if(out&&typeof out==='object') out=out.url||out.href||null;
      if(!out||typeof out!=='string') throw new Error('Replicate 출력 URL 없음');
      return {url:out, meta:{provider:'replicate',model,video:kind==='video',faceRef:!!imageUrl}};
    }
    if(st==='failed'||st==='canceled'||st==='cancelled') throw new Error('Replicate 실패: '+(data.error||st));
    if(!getUrl) throw new Error('Replicate 상태 URL 없음');
    await new Promise(r=>setTimeout(r,2000));
    const poll=await fetch(getUrl,{headers:{'Authorization':'Token '+key,'Content-Type':'application/json'}});
    if(!poll.ok) continue;
    data=await poll.json();
  }
  throw new Error('Replicate 시간 초과');
}

async function studioGenOpenAI(prompt, key, model, opts){
  opts=opts||{};
  key=String(key||'').trim();
  if(!key){ toast('스튜디오 설정에서 OpenAI API 키를 입력해주세요','err'); throw new Error('no-openai-key'); }
  model=String(model||'gpt-image-1').trim()||'gpt-image-1';
  const p=opts.raw?sanitizeStudioPrompt(prompt):photorealPrompt(prompt);
  const imageUrl=opts.refImage||opts.refUrl||null;
  // Prefer edits/variations when we have a face blob (identity lock)
  if(imageUrl && (String(imageUrl).startsWith('data:') || String(imageUrl).indexOf('http')===0)){
    try{
      let blob;
      if(String(imageUrl).startsWith('data:')) blob=await (await fetch(imageUrl)).blob();
      else blob=await fetchAsBlob(imageUrl);
      const fd=new FormData();
      fd.append('image', blob, 'face.png');
      fd.append('prompt', p);
      fd.append('n', '1');
      fd.append('size', '1024x1024');
      if(model.indexOf('dall-e')===0){ fd.append('model', model.indexOf('dall-e-2')===0?'dall-e-2':'dall-e-2'); fd.append('response_format','b64_json'); }
      else { fd.append('model', model); }
      const res=await fetch('https://api.openai.com/v1/images/edits',{method:'POST',headers:{'Authorization':'Bearer '+key},body:fd});
      if(res.ok){
        const data=await res.json();
        const item=(data.data&&data.data[0])||null;
        if(item&&item.b64_json) return {url:'data:image/png;base64,'+item.b64_json, meta:{provider:'openai',model,faceRef:true,via:'edits'}};
        if(item&&item.url) return {url:item.url, meta:{provider:'openai',model,faceRef:true,via:'edits'}};
      }
      // fall through to generations if edits unsupported for this model
    }catch(e){ /* prompt-only fallback */ }
  }
  const body={model, prompt:p, size:'1024x1024', n:1};
  if(model.indexOf('dall-e')===0) body.response_format='b64_json';
  const res=await fetch('https://api.openai.com/v1/images/generations',{method:'POST',headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!res.ok){ let msg='OpenAI 요청 실패 ('+res.status+')'; try{ const j=await res.json(); if(j&&j.error&&j.error.message) msg=String(j.error.message);}catch(e){} throw new Error(msg); }
  const data=await res.json();
  const item=(data.data&&data.data[0])||null;
  if(!item) throw new Error('OpenAI 응답에 이미지 없음');
  if(item.b64_json) return {url:'data:image/png;base64,'+item.b64_json, meta:{provider:'openai',model,faceRef:false}};
  if(item.url) return {url:item.url, meta:{provider:'openai',model,faceRef:false}};
  throw new Error('OpenAI 이미지 데이터 없음');
}

async function studioGenGoogle(prompt, key, model, opts){
  opts=opts||{};
  key=String(key||'').trim();
  if(!key){ toast('Google AI Studio API 키를 설정해주세요','err'); throw new Error('no-google-key'); }
  model=String(model||'gemini-2.5-flash-image').trim()||'gemini-2.5-flash-image';
  const p=opts.raw?sanitizeStudioPrompt(prompt):photorealPrompt(prompt);
  const imageUrl=opts.refImage||opts.refUrl||null;
  const parts=[{text:p}];
  if(imageUrl){
    try{
      let dataUrl=imageUrl;
      if(!String(imageUrl).startsWith('data:')) dataUrl=await urlToDataUrl(imageUrl);
      if(dataUrl&&String(dataUrl).startsWith('data:')){
        const m=String(dataUrl).match(/^data:([^;]+);base64,(.+)$/);
        if(m) parts.unshift({inline_data:{mime_type:m[1],data:m[2]}});
      }
    }catch(e){}
  }
  const tryModels=[model,'gemini-2.5-flash-image','gemini-2.0-flash-preview-image-generation','gemini-2.0-flash-exp-image-generation'];
  let lastErr=null;
  for(const md of tryModels){
    try{
      const body={
        contents:[{role:'user', parts}],
        generationConfig:{ responseModalities:['TEXT','IMAGE'] }
      };
      const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(md)+':generateContent?key='+encodeURIComponent(key);
      const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!res.ok){
        let msg='Google AI 요청 실패 ('+res.status+')';
        try{ const j=await res.json(); if(j&&j.error&&j.error.message) msg=String(j.error.message);}catch(e){}
        lastErr=new Error(msg); continue;
      }
      const data=await res.json();
      const cands=data.candidates||[];
      for(const c of cands){
        const ps=(c.content&&c.content.parts)||[];
        for(const part of ps){
          const inline=part.inlineData||part.inline_data;
          if(inline&&inline.data){
            const mime=inline.mimeType||inline.mime_type||'image/png';
            return {url:'data:'+mime+';base64,'+inline.data, meta:{provider:'google',model:md,faceRef:!!imageUrl}};
          }
        }
      }
      lastErr=new Error('Google AI 응답에 이미지 없음');
    }catch(e){ lastErr=e; }
  }
  try{
    const imagenModels=['imagen-3.0-generate-002','imagen-4.0-generate-001'];
    for(const md of imagenModels){
      const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(md)+':predict?key='+encodeURIComponent(key);
      const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instances:[{prompt:p}],parameters:{sampleCount:1,aspectRatio:'3:4'}})});
      if(!res.ok) continue;
      const data=await res.json();
      const pred=(data.predictions&&data.predictions[0])||null;
      const b64=pred&&(pred.bytesBase64Encoded||pred.image||null);
      if(b64) return {url:'data:image/png;base64,'+b64, meta:{provider:'google',model:md,faceRef:false,via:'imagen'}};
    }
  }catch(e){}
  throw lastErr||new Error('Google AI 이미지 생성 실패');
}

async function runStudioGenerate(){
  if(studioState.busy) return;
  if(!needLogin('AI 생성을 하려면 로그인이 필요합니다.')) return;
  const prompt=(studioState.prompt||'').trim(); if(!prompt){ toast('프롬프트를 입력해주세요','err'); return; }
  const cfg=loadStudioCfg();
  const kind=studioState.mediaKind==='video'?'video':'image';
  let conn=findConnection(studioState.connectionId, cfg);
  if(!conn||conn.kind!==kind){ conn=pickDefaultConnection(kind, cfg); if(conn) studioState.connectionId=conn.id; }
  if(!conn){ toast('사용 가능한 연결이 없습니다. 설정에서 연결을 추가하세요','err'); return; }
  if(connectionKeyMissing(conn, cfg)){ toast('이 연결에 필요한 API 키가 없습니다. 설정에서 키를 저장하세요','err'); return; }
  if((conn.provider==='replicate'||conn.provider==='fal'||conn.provider==='openai'||conn.provider==='google')&&!String(conn.model||'').trim()){ toast('연결에 모델/엔드포인트 ID를 입력해주세요','err'); return; }

  let seed=(Date.now()%1000000)^_hash(prompt); let extra=''; let refUrl=null; let refImage=null; let refHttp=null; let faceLockMode='none';
  const attached=studioState.attachToModelId!=null;
  let attachedModel=null;
  if(attached){
    attachedModel=DB.models.find(x=>x.id===studioState.attachToModelId);
    if(attachedModel){
      ensureFaceIdentity(attachedModel);
      if(attachedModel.faceSeed!=null) seed=Number(attachedModel.faceSeed)||seed;
      extra='same identity as reference face photo, consistent face, same person, faceId '+(attachedModel.faceId||'')+', do not change identity';
      try{
        const ref=await resolveFaceRef(attachedModel);
        refHttp=ref.httpUrl; refImage=ref.imageUrl; refUrl=ref.httpUrl||ref.imageUrl;
        faceLockMode=ref.imageUrl?'image-ref':'prompt';
        if(ref.dataUrl && (!attachedModel.faceRef || String(attachedModel.faceRef).indexOf('http')===0)){
          // persist dataUrl cover when we successfully resolved one
          if(ref.dataUrl.indexOf('data:')===0){ attachedModel.faceRef=ref.dataUrl; if(!attachedModel.photos||!attachedModel.photos.length) attachedModel.photos=[ref.dataUrl]; save(); }
        }
      }catch(e){ faceLockMode='prompt'; }
    }
  }
  const useRaw=!attached;

  studioState.busy=true; studioState._faceLockMode=faceLockMode; render();
  try{
    let result=null;
    const finalPrompt=useRaw?studioBuildPrompt(prompt,{extra}):studioBuildPrompt(prompt,{forcePhotoreal:true,extra});
    const genOpts={raw:useRaw, extra, refUrl, refHttp, refImage, model:conn.model, video:kind==='video'};
    if(conn.provider==='pollinations'){
      if(kind==='video') throw new Error('Pollinations는 이미지 전용입니다');
      result=await studioGenPollinations(prompt, seed, genOpts);
    } else if(conn.provider==='fal'){
      if(!cfg.falKey){ toast('Fal API 키가 필요합니다','err'); throw new Error('no-fal-key'); }
      result=await studioGenFal(conn.model, finalPrompt, cfg.falKey, {video:kind==='video', raw:true, refImage:refImage||refUrl, refUrl});
    } else if(conn.provider==='replicate'){
      result=await studioGenReplicate(conn.model, finalPrompt, kind, {raw:true, refImage:refImage||refUrl, refUrl});
    } else if(conn.provider==='openai'){
      if(kind==='video') throw new Error('OpenAI Images는 이미지 전용입니다');
      result=await studioGenOpenAI(finalPrompt, cfg.openaiKey, conn.model||'gpt-image-1', {raw:true, refImage:refImage||refUrl, refUrl});
    } else if(conn.provider==='google'){
      if(kind==='video') throw new Error('Google AI(Gemini/Imagen)는 현재 이미지 전용입니다. 영상은 Fal·Replicate·Higgsfield를 쓰세요');
      result=await studioGenGoogle(finalPrompt, cfg.googleGeminiKey, conn.model||'gemini-2.5-flash-image', {raw:true, refImage:refImage||refUrl, refUrl});
    } else if(conn.provider==='higgsfield'){
      result=await studioGenHiggs(finalPrompt, seed, kind==='video', {raw:true, refImage:refImage||refUrl, refUrl});
    } else {
      result=await studioGenDemo(prompt, seed);
      if(kind==='video') toast('데모는 영상 대신 이미지를 만듭니다');
    }
    const item={ id:'g'+Date.now(), url:result.url, meta:result.meta||{}, prompt, provider:conn.provider, connectionId:conn.id, connectionName:conn.name, gender:studioState.gender, age:studioState.age, style:studioState.style, base:studioState.base, seed:(result.meta&&result.meta.seed!=null)?result.meta.seed:seed, at:Date.now(), isVideo:!!(kind==='video'||(result.meta&&result.meta.video)), faceLock:faceLockMode, attachToModelId:studioState.attachToModelId };
    studioState.last=item; studioState.provider=conn.provider; studioHistory.unshift(item); if(studioHistory.length>12) studioHistory.length=12;
    // Auto-attach under the face model when generating in face-lock mode
    if(attached && studioState.attachToModelId!=null){
      try{
        await addAssetToOwnedModel(studioState.attachToModelId, item, {quiet:true});
        toast('생성 완료 · 이 얼굴에 작품으로 저장됨','ok');
        return;
      }catch(e){ toast('생성은 됐지만 저장 실패 — 「이 얼굴에 작품 추가」를 눌러주세요','err'); }
    } else {
      toast('생성 완료','ok');
    }
  }catch(e){
    const msg=String(e&&e.message||e);
    if(!['no-fal-key','no-higgs','no-replicate-key','no-openai-key','no-google-key'].includes(msg)) toast('생성 실패: '+msg,'err');
  } finally{ studioState.busy=false; if(view==='studio'||view==='detail') render(); }
}

async function persistCoverAndAsset(modelId, assetId, url){
  const faceKey='face-'+modelId, assetKey='asset-'+modelId+'-'+assetId; let dataUrl=null;
  try{
    if(String(url).startsWith('data:')){ dataUrl=url; const bin=await (await fetch(url)).blob(); await idbAssetPut(faceKey,bin); await idbAssetPut(assetKey,bin); }
    else { let blob=null; try{ blob=await fetchAsBlob(url);}catch(e){} if(blob){ await idbAssetPut(faceKey,blob); await idbAssetPut(assetKey,blob); dataUrl=await blobToDataUrl(blob); } else { dataUrl=await urlToDataUrl(url); if(dataUrl&&String(dataUrl).startsWith('data:')){ const bin=await (await fetch(dataUrl)).blob(); await idbAssetPut(faceKey,bin); await idbAssetPut(assetKey,bin); } } }
  }catch(e){ dataUrl=dataUrl||url; }
  return {faceKey, assetKey, dataUrl:dataUrl||url};
}

async function addAssetToOwnedModel(modelId, item, opts){
  opts=opts||{};
  if(!needLogin('작품을 추가하려면 로그인이 필요합니다.')) return;
  const m=DB.models.find(x=>x.id===modelId); if(!m){ toast('모델을 찾을 수 없습니다','err'); return; }
  ensureFaceIdentity(m); if(!isModelOwner(m)){ toast('소유자만 작품을 추가할 수 있습니다','err'); return; }
  if(!item||!item.url){ toast('생성 결과가 없습니다','err'); return; }
  const assetId='a'+Date.now(); const assetKey='asset-'+m.id+'-'+assetId; let dataUrl=item.url;
  try{ if(String(item.url).startsWith('data:')){ dataUrl=item.url; await idbAssetPut(assetKey, await (await fetch(dataUrl)).blob()); }
    else { try{ const blob=await fetchAsBlob(item.url); await idbAssetPut(assetKey, blob); dataUrl=await blobToDataUrl(blob); }catch(e){ const du=await urlToDataUrl(item.url); if(du){ dataUrl=du; try{ await idbAssetPut(assetKey, await (await fetch(du)).blob()); }catch(e2){} } } }
  }catch(e){}
  m.assets.push({ id:assetId, type:item.isVideo?'video':'image', blobKey:assetKey, dataUrl, thumb:dataUrl, prompt:item.prompt, by:DB.user.nick, byKey:_userKey(), at:Date.now(), provider:item.provider||'pollinations', faceLock:item.faceLock||null });
  // keep faceRef as the identity anchor (first face photo), do not overwrite with every asset
  if(!m.faceRef && dataUrl) m.faceRef=dataUrl;

  m.aiStudio=true;

}

async function downloadAllModelAssets(m){
  if(!needLogin('전체 다운로드는 로그인이 필요합니다.')) return;
  ensureModelFields(m); if(!isModelOwner(m)){ toast('소유자만 전체 작품을 받을 수 있습니다','err'); return; }
  const safe=(m.name||'model').replace(/[\\\\/:*?"<>|]+/g,'_').slice(0,40); const files=[];
  files.push({ name:safe+'/model.json', blob:new Blob([JSON.stringify({name:m.name,faceId:m.faceId,faceSeed:m.faceSeed,facePrompt:m.facePrompt,ownerKey:m.ownerKey,share:m.share,assets:(m.assets||[]).map(a=>({id:a.id,type:a.type,prompt:a.prompt,provider:a.provider,at:a.at,by:a.by}))},null,2)],{type:'application/json'}) });
  try{ let b=await idbAssetGet('face-'+m.id); if(!b){ const src=m.faceRef||(m.photos&&m.photos[0]); if(src){ if(String(src).startsWith('data:')) b=await (await fetch(src)).blob(); else { try{ b=await fetchAsBlob(src);}catch(e){} } } } if(b) files.push({ name:safe+'/face.jpg', blob:b }); }catch(e){}
  for(let i=0;i<(m.assets||[]).length;i++){ const a=m.assets[i]; let blob=null; if(a.blobKey){ try{ blob=await idbAssetGet(a.blobKey);}catch(e){} } if(!blob&&a.dataUrl){ try{ if(String(a.dataUrl).startsWith('data:')) blob=await (await fetch(a.dataUrl)).blob(); else blob=await fetchAsBlob(a.dataUrl);}catch(e){} } if(!blob) continue; const ext=a.type==='video'?'mp4':((blob.type||'').includes('png')?'png':'jpg'); files.push({ name:safe+'/assets/'+String(i+1).padStart(2,'0')+'-'+a.id+'.'+ext, blob }); }
  if(files.length<=1){ toast('받을 작품이 없습니다','err'); return; }
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  try{
    if(isIOS && _shareFiles){ const fileList=files.map(f=>new File([f.blob], f.name.split('/').pop(), {type:f.blob.type||'application/octet-stream'})); await _shareFiles(fileList, m.name||safe, '모델 작품 전체'); toast('공유/저장 시트로 저장하세요','ok'); }
    else { const zipBlob=await zipStore(files); if(_saveBlob) await _saveBlob(safe+'-assets.zip', zipBlob, 'application/zip'); else { const a=document.createElement('a'); a.href=URL.createObjectURL(zipBlob); a.download=safe+'-assets.zip'; a.click(); } toast('전체 작품 ZIP 저장됨','ok'); }
  }catch(e){ if(e&&e.name==='AbortError') toast('저장 취소'); else toast('전체 다운로드 실패: '+(e.message||e),'err'); }
}
