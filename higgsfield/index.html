<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src 'self' data: blob: https:; media-src data: blob: https:; connect-src 'self' blob: https:; base-uri 'none'; form-action 'none'">
<title>루크 스튜디오 — Higgsfield 이미지·영상 생성 · 공개 갤러리 | 페이스루크</title>
<meta name="description" content="lukemodel.com 루크 스튜디오: 하나의 프롬프트 바로 Soul·Seedance·Kling·Wan 등 Higgsfield 모델 이미지·영상 생성(내 키 사용), 공개 갤러리에 누구나 업로드·다운로드.">
<link rel="canonical" href="https://lukemodel.com/higgsfield/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="FaceLook / 페이스루크">
<meta property="og:url" content="https://lukemodel.com/higgsfield/">
<meta property="og:title" content="루크 스튜디오 — Higgsfield 모델 이미지·영상 생성 + 공개 갤러리">
<meta property="og:description" content="One prompt bar, 20+ image & video models (bring your own Higgsfield key). Public gallery: anyone can upload & download.">
<meta property="og:image" content="https://lukemodel.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/logo-512.png" type="image/png">
<style>
:root{--bg:#0b0c0f;--panel:#15171c;--panel2:#1c1f26;--line:#2a2e38;--tx:#eceef3;--dim:#8d94a5;--acc:#d1fe17;--acc2:#4f7cff;--bad:#ff6b6b;--ok:#7de2a8;--warn:#ffb86c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 Inter,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(11,12,15,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:800;white-space:nowrap}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--acc);color:#111;display:grid;place-items:center;font-weight:900}
.brand small{color:var(--dim);font-weight:600;font-size:12px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.tabs button{padding:7px 13px;border-radius:8px;color:var(--dim);font-weight:600;white-space:nowrap}
.tabs button:hover{color:var(--tx);background:var(--panel)}
.tabs button[aria-selected=true]{color:#111;background:var(--acc)}
.tabs .cnt{opacity:.65;margin-left:5px;font-size:12px}
.right{display:flex;align-items:center;gap:8px}
.lamp{width:9px;height:9px;border-radius:50%;background:#555;box-shadow:0 0 0 3px rgba(255,255,255,.04)}
.lamp.on{background:var(--acc)}.lamp.busy{background:var(--acc);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.btn{padding:8px 14px;border-radius:9px;background:var(--acc);color:#111;font-weight:700;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--panel);color:var(--tx);border:1px solid var(--line)}
.btn.ghost:hover{border-color:#40465a}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger{background:#3a1d22;color:#ffb3b3;border:1px solid #5a2a31}
main{padding:16px 18px 250px;max-width:1500px;margin:0 auto}
.notice{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;color:#c9cedb;font-size:13px;line-height:1.65}
.notice b{color:var(--tx)}
.notice.warn{border-color:#5a4a24;background:#1d1a12}
.grid{columns:4 260px;column-gap:12px}
.tile{break-inside:avoid;margin-bottom:12px;border-radius:12px;overflow:hidden;background:var(--panel);border:1px solid var(--line);position:relative;cursor:zoom-in}
.tile img,.tile video{display:block;width:100%;height:auto;background:linear-gradient(135deg,#1b1e26,#262b36)}
.tile .ph{aspect-ratio:var(--ar,1);background:linear-gradient(110deg,#171a21 30%,#232733 50%,#171a21 70%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;display:grid;place-items:center;color:var(--dim);font-size:12.5px;text-align:center;padding:14px}
@keyframes shimmer{to{background-position:-200% 0}}
.tile .fail{aspect-ratio:var(--ar,1);display:flex;flex-direction:column;justify-content:center;gap:8px;padding:16px;color:#ffb3b3;font-size:12.5px;background:#1a1214}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.78));font-size:11.5px;color:#dfe3ec;display:flex;justify-content:space-between;gap:6px;opacity:0;transition:opacity .15s}
.tile:hover .cap,.tile:focus-within .cap{opacity:1}
.tile .cap span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tile .acts{position:absolute;top:8px;right:8px;display:flex;gap:5px;opacity:0;transition:opacity .15s}
.tile:hover .acts,.tile:focus-within .acts,.tile.sel .acts{opacity:1}
.ic{width:30px;height:30px;border-radius:8px;background:rgba(10,11,14,.72);color:#fff;display:grid;place-items:center;font-size:14px}
.ic:hover{background:rgba(10,11,14,.92)}
.ic.on{color:var(--acc)}
.chk{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:7px;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.35);opacity:0;display:grid;place-items:center;color:#111;font-weight:900;font-size:13px}
.tile:hover .chk,.selecting .chk{opacity:1}
.tile.sel{outline:2px solid var(--acc)}
.tile.sel .chk{background:var(--acc);border-color:var(--acc)}
.badge{position:absolute;top:8px;left:40px;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.66)}
.empty{text-align:center;padding:60px 16px;color:var(--dim)}
.empty h2{color:var(--tx);font-size:20px;margin-bottom:6px}
.starters{display:flex;flex-direction:column;gap:8px;max-width:640px;margin:20px auto 0}
.starters button{text-align:left;padding:11px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:#cfd4df}
.starters button:hover{border-color:var(--acc);color:var(--tx)}
/* composer */
.composer{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(980px,calc(100% - 20px));z-index:30;background:rgba(21,23,28,.97);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:10px 12px 10px}
.strip{min-height:0;font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:10px;margin-bottom:6px}
.strip:empty{display:none}
.strip .bar{flex:1;height:2px;background:var(--line);position:relative;overflow:hidden;border-radius:2px}
.strip .bar i{position:absolute;inset:0;background:var(--acc);transform-origin:left;animation:drain 6s linear forwards}
@keyframes drain{to{transform:scaleX(0)}}
.tray{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tray:empty{display:none}
.slot{display:flex;align-items:center;gap:7px;padding:4px 8px 4px 4px;border-radius:9px;background:var(--panel2);border:1px dashed #3a3f4d;color:var(--dim);font-size:12px}
.slot.filled{border-style:solid;color:var(--tx)}
.slot .th{width:34px;height:34px;border-radius:6px;background:#262a33 center/contain no-repeat;display:grid;place-items:center;font-size:16px}
.slot .x{color:var(--dim);font-size:14px;padding:0 3px}
textarea#prompt{width:100%;min-height:52px;max-height:180px;resize:none;background:transparent;border:0;outline:none;font-size:15px;line-height:1.55;padding:6px 4px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:#d7dbe5}
.chip:hover{border-color:#454b5e}
.chip select{background:transparent;border:0;outline:none;font-weight:600;cursor:pointer}
.chip select option{background:#1c1f26}
.chip input[type=checkbox]{accent-color:var(--acc)}
.chip.model{font-weight:700}
.chip[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.chip.ref-btn.on{border-color:var(--acc);color:var(--acc)}
.chip .cnt{opacity:.7;font-size:11.5px}
.slot.unused{opacity:.45}
.composer.hot{outline:2px dashed var(--acc);outline-offset:3px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.spacer{flex:1}
.gen{padding:9px 18px;border-radius:11px;font-size:14px}
.kbd{font-size:11px;opacity:.6;margin-left:6px}
/* selection bar */
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:35;display:none;align-items:center;gap:8px;padding:9px 12px;border-radius:14px;background:#1c1f26;border:1px solid var(--acc);box-shadow:0 12px 40px rgba(0,0,0,.6)}
.selbar.on{display:flex}
/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(520px,100%);max-height:92vh;overflow:auto;padding:20px}
.box.wide{width:min(1180px,100%);padding:0;display:grid;grid-template-columns:1fr 340px;overflow:hidden}
.box h3{font-size:17px;margin-bottom:8px}
.box p{color:#c3c8d4;font-size:13px;line-height:1.65;margin-bottom:10px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;margin:4px 0 10px}
.inp:focus{border-color:var(--acc)}
.acts2{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.vmedia{background:#050506;display:grid;place-items:center;min-height:300px;max-height:92vh}
.vmedia img,.vmedia video{max-width:100%;max-height:92vh;display:block}
.vside{padding:18px;overflow:auto;max-height:92vh;display:flex;flex-direction:column;gap:12px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;border-bottom:1px solid var(--line);padding:6px 0}
.kv .k{color:var(--dim)}
.ptxt{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;white-space:pre-wrap;word-break:break-word;max-height:200px;overflow:auto}
.mlist{display:flex;flex-direction:column;gap:2px;max-height:56vh;overflow:auto;margin-top:6px}
.mlist button{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:9px 10px;border-radius:9px}
.mlist button:hover,.mlist button.on{background:var(--panel2)}
.mlist button.on{outline:1px solid var(--acc)}
.mlist small{color:var(--dim)}
.mhead{font-size:11px;font-weight:800;color:var(--dim);letter-spacing:.8px;padding:10px 10px 4px}
.ptabs{display:flex;gap:4px;margin:6px 0 10px;flex-wrap:wrap}
.ptabs button{padding:6px 11px;border-radius:8px;background:var(--panel2);color:var(--dim);font-weight:600;font-size:12.5px}
.ptabs button.on{background:var(--acc);color:#111}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;max-height:50vh;overflow:auto}
.pgrid button{aspect-ratio:1;border-radius:9px;background:#232733 center/contain no-repeat;border:1px solid var(--line)}
.pgrid button:hover{border-color:var(--acc)}
.drop{border:1.5px dashed #444a5a;border-radius:12px;padding:22px;text-align:center;color:var(--dim);cursor:pointer}
.drop.hot{border-color:var(--acc);color:var(--tx)}
.toast{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:80;background:#22262f;border:1px solid var(--line);padding:9px 14px;border-radius:10px;font-size:13px;display:none;max-width:90vw}
.toast.on{display:block}.toast.err{border-color:#6a2e36;color:#ffc2c2}.toast.ok{border-color:#3c5a18}
.foot{color:var(--dim);font-size:11.5px;text-align:center;padding:10px 0 0;line-height:1.7}
.foot a{color:#b6bccb}
@media (max-width:760px){
  .top{flex-wrap:wrap;gap:8px;padding:8px 10px}
  .tabs{order:3;flex-basis:100%}
  .brand small{display:none}
  main{padding:12px 10px 280px}
  .grid{columns:2 150px;column-gap:8px}.tile{margin-bottom:8px}
  .box.wide{grid-template-columns:1fr}
  .vmedia{max-height:55vh}.vmedia img,.vmedia video{max-height:55vh}
  .composer{bottom:6px;border-radius:14px}
  .kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/" title="페이스루크 홈"><span class="mark">루</span><span>루크 스튜디오</span><small>lukemodel.com · Higgsfield</small></a>
  <nav class="tabs" role="tablist" id="tabs" aria-label="갤러리 범위"></nav>
  <div class="right">
    <span class="lamp" id="lamp" title="키 없음"></span>
    <button class="btn ghost sm" id="keyBtn">키 추가</button>
    <button class="btn sm" id="upBtn" title="이미지·영상을 공개 갤러리에 올리기">+ 업로드</button>
  </div>
</header>
<main id="main">
  <div id="notice"></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden></div>
  <div id="more" style="text-align:center;margin:14px 0" hidden><button class="btn ghost" id="moreBtn">더 보기</button></div>
  <p class="foot">루크 스튜디오는 lukemodel.com(페이스루크)의 독립 구현입니다. UX는 오픈소스 스튜디오 <a href="https://www.openhiggsfield.ai/" target="_blank" rel="noopener">OpenHiggsfield</a>(<a href="https://github.com/wide-trace/open-higgsfield" target="_blank" rel="noopener">GitHub</a>)를 참고했으며, Higgsfield 및 OpenHiggsfield와 제휴 관계가 없습니다.<br>생성은 방문자 본인의 Higgsfield API 키로 브라우저에서 platform.higgsfield.ai에 직접 요청되며, 키는 이 브라우저(localStorage)에만 저장됩니다. · <a href="/terms.html">이용약관</a> · <a href="/privacy.html">개인정보</a></p>
</main>

<section class="composer" id="composer" aria-label="생성">
  <div class="strip" id="strip"></div>
  <div class="tray" id="tray"></div>
  <textarea id="prompt" placeholder="만들고 싶은 장면을 설명하세요…" aria-label="프롬프트"></textarea>
  <div class="row" id="ctl"></div>
</section>
<div class="selbar" id="selbar"></div>
<div id="modal"></div>
<div class="toast" id="toast" role="status"></div>

<script src="/shared-config.js"></script>
<script src="/lm-auth.js"></script>
<script src="/traffic.js" defer></script>
<script src="/hf-core.js"></script>
<script src="app.js"></script>
</body>
</html>
